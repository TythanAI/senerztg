<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Калькулятор</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/shared/app.css">
</head>
<body>
<div id="root"><div class="spinner"></div></div>
<script src="/shared/tg.js"></script>
<script>

const root = document.getElementById('root');
let CFG = null;
const values = {};
const chosen = new Set();

function compute() {
  const a = CFG.app;
  let sum = a.base;
  a.fields.forEach(f => { sum += (Number(values[f.id]) || 0) * f.per_unit; });
  a.options.forEach(o => { if (chosen.has(o.id) && o.add) sum += o.add; });
  a.options.forEach(o => { if (chosen.has(o.id) && o.multiplier) sum *= o.multiplier; });
  return Math.round(sum);
}

function render() {
  const a = CFG.app, cur = a.currency;
  const fields = a.fields.map(f => `
    <label for="${f.id}">${TG.escape(f.label)}</label>
    <input id="${f.id}" type="number" inputmode="numeric"
           min="${f.min}" max="${f.max}" value="${values[f.id]}">`).join('');

  const options = a.options.map(o => {
    const extra = o.add ? `+${TG.money(o.add, cur)}` : `×${o.multiplier}`;
    return `<button class="chip" aria-pressed="${chosen.has(o.id)}" data-opt="${o.id}">
      ${TG.escape(o.label)} · ${extra}</button>`;
  }).join(' ');

  root.innerHTML = `<h1>${TG.escape(a.title)}</h1>
    ${fields}
    <h2>Дополнительно</h2><div class="stack">${options}</div>
    <div class="card" style="margin-top:18px">
      <div class="row"><span>Итого</span>
      <span class="price" id="sum">${TG.money(compute(), cur)}</span></div>
      <p class="hint">Предварительный расчёт. Точную смету менеджер подтвердит после осмотра.</p>
    </div>`;

  a.fields.forEach(f => {
    root.querySelector('#' + f.id).oninput = e => {
      const n = Math.max(f.min, Math.min(f.max, Number(e.target.value) || f.min));
      values[f.id] = n;
      root.querySelector('#sum').textContent = TG.money(compute(), cur);
    };
  });
  root.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => {
    const id = b.dataset.opt;
    chosen.has(id) ? chosen.delete(id) : chosen.add(id);
    TG.haptic('light');
    render();
  });
  TG.mainButton('Отправить заявку', submit);
}

async function submit() {
  TG.hideMainButton();
  try {
    const res = await TG.api('/api/calc/submit', {
      kind: 'quote', values, options: [...chosen], total: compute(), currency: CFG.app.currency
    });
    TG.haptic('success');
    root.innerHTML = `<div class="notice"><h2>Заявка #${res.id}</h2>
      <p class="price">${TG.money(compute(), CFG.app.currency)}</p>
      <p>${TG.escape(res.message)}</p></div>`;
    setTimeout(() => TG.close(), 2500);
  } catch (err) {
    TG.haptic('error'); TG.alert(err.message); TG.mainButton('Отправить заявку', submit);
  }
}

(async function start() {
  if (!TG.requireTelegram(root)) return;
  TG.init();
  try {
    CFG = await TG.api('/api/calc/config');
    CFG.app.fields.forEach(f => values[f.id] = f.default);
    render();
  } catch (err) { root.innerHTML = `<div class="notice"><h2>Ошибка</h2><p>${TG.escape(err.message)}</p></div>`; }
})();

</script>
</body>
</html>
