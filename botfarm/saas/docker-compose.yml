# All 13 APIs on one host. Build once, run many.
services:
  saas-qr:
    build: .
    container_name: saas-qr
    restart: unless-stopped
    environment:
      SERVICE: qr
      PORT: "8001"
      SAAS_DB: /app/data/qr.db
      SAAS_ADMIN_TOKEN: ${SAAS_ADMIN_TOKEN:?set SAAS_ADMIN_TOKEN in .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CRYPTOBOT_TOKEN: ${CRYPTOBOT_TOKEN:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    ports:
      - "8001:8001"
    volumes:
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  saas-ogimage:
