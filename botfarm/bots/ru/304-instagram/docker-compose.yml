# Build from the botfarm root:  docker compose -f bots/ru/304-instagram/docker-compose.yml up -d
services:
  botfarm-ru-304-instagram:
    build:
      context: ../../..
      dockerfile: bots/ru/304-instagram/Dockerfile
    container_name: botfarm-ru-304-instagram
    restart: unless-stopped
    env_file: .env
    ports:
      - "9303:9303"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
