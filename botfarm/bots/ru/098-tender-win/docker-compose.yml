# Build from the botfarm root:  docker compose -f bots/ru/098-tender-win/docker-compose.yml up -d
services:
  botfarm-ru-tender-win:
    build:
      context: ../../..
      dockerfile: bots/ru/098-tender-win/Dockerfile
    container_name: botfarm-ru-tender-win
    restart: unless-stopped
    env_file: .env
    ports:
      - "9097:9097"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
