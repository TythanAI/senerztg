# Build from the botfarm root:  docker compose -f bots/ru/024-altcoin-scan/docker-compose.yml up -d
services:
  botfarm-ru-altcoin-scan:
    build:
      context: ../../..
      dockerfile: bots/ru/024-altcoin-scan/Dockerfile
    container_name: botfarm-ru-altcoin-scan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9023:9023"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
