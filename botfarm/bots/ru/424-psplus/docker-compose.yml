# Build from the botfarm root:  docker compose -f bots/ru/424-psplus/docker-compose.yml up -d
services:
  botfarm-ru-424-psplus:
    build:
      context: ../../..
      dockerfile: bots/ru/424-psplus/Dockerfile
    container_name: botfarm-ru-424-psplus
    restart: unless-stopped
    env_file: .env
    ports:
      - "9423:9423"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
