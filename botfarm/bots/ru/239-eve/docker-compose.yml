# Build from the botfarm root:  docker compose -f bots/ru/239-eve/docker-compose.yml up -d
services:
  botfarm-ru-239-eve:
    build:
      context: ../../..
      dockerfile: bots/ru/239-eve/Dockerfile
    container_name: botfarm-ru-239-eve
    restart: unless-stopped
    env_file: .env
    ports:
      - "9238:9238"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
