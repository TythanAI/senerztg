# Build from the botfarm root:  docker compose -f bots/ru/348-notion/docker-compose.yml up -d
services:
  botfarm-ru-348-notion:
    build:
      context: ../../..
      dockerfile: bots/ru/348-notion/Dockerfile
    container_name: botfarm-ru-348-notion
    restart: unless-stopped
    env_file: .env
    ports:
      - "9347:9347"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
