# Build from the botfarm root:  docker compose -f bots/ru/300-otter-ai/docker-compose.yml up -d
services:
  botfarm-ru-300-otter-ai:
    build:
      context: ../../..
      dockerfile: bots/ru/300-otter-ai/Dockerfile
    container_name: botfarm-ru-300-otter-ai
    restart: unless-stopped
    env_file: .env
    ports:
      - "9299:9299"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
