# Build from the botfarm root:  docker compose -f bots/ru/220-zenless/docker-compose.yml up -d
services:
  botfarm-ru-220-zenless:
    build:
      context: ../../..
      dockerfile: bots/ru/220-zenless/Dockerfile
    container_name: botfarm-ru-220-zenless
    restart: unless-stopped
    env_file: .env
    ports:
      - "9219:9219"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
