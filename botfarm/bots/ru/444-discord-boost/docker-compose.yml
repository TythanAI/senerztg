# Build from the botfarm root:  docker compose -f bots/ru/444-discord-boost/docker-compose.yml up -d
services:
  botfarm-ru-444-discord-boost:
    build:
      context: ../../..
      dockerfile: bots/ru/444-discord-boost/Dockerfile
    container_name: botfarm-ru-444-discord-boost
    restart: unless-stopped
    env_file: .env
    ports:
      - "9443:9443"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
