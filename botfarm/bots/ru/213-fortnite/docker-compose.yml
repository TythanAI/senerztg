# Build from the botfarm root:  docker compose -f bots/ru/213-fortnite/docker-compose.yml up -d
services:
  botfarm-ru-213-fortnite:
    build:
      context: ../../..
      dockerfile: bots/ru/213-fortnite/Dockerfile
    container_name: botfarm-ru-213-fortnite
    restart: unless-stopped
    env_file: .env
    ports:
      - "9212:9212"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
