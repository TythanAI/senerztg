# Build from the botfarm root:  docker compose -f bots/ru/187-meditation/docker-compose.yml up -d
services:
  botfarm-ru-187-meditation:
    build:
      context: ../../..
      dockerfile: bots/ru/187-meditation/Dockerfile
    container_name: botfarm-ru-187-meditation
    restart: unless-stopped
    env_file: .env
    ports:
      - "9186:9186"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
