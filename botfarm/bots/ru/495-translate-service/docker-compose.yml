# Build from the botfarm root:  docker compose -f bots/ru/495-translate-service/docker-compose.yml up -d
services:
  botfarm-ru-495-translate-service:
    build:
      context: ../../..
      dockerfile: bots/ru/495-translate-service/Dockerfile
    container_name: botfarm-ru-495-translate-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "9494:9494"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
