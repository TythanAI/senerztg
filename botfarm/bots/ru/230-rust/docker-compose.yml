# Build from the botfarm root:  docker compose -f bots/ru/230-rust/docker-compose.yml up -d
services:
  botfarm-ru-230-rust:
    build:
      context: ../../..
      dockerfile: bots/ru/230-rust/Dockerfile
    container_name: botfarm-ru-230-rust
    restart: unless-stopped
    env_file: .env
    ports:
      - "9229:9229"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
