# Build from the botfarm root:  docker compose -f bots/ru/265-more-tv/docker-compose.yml up -d
services:
  botfarm-ru-265-more-tv:
    build:
      context: ../../..
      dockerfile: bots/ru/265-more-tv/Dockerfile
    container_name: botfarm-ru-265-more-tv
    restart: unless-stopped
    env_file: .env
    ports:
      - "9264:9264"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
