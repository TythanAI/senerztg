# Build from the botfarm root:  docker compose -f bots/ru/464-steam-monitor/docker-compose.yml up -d
services:
  botfarm-ru-464-steam-monitor:
    build:
      context: ../../..
      dockerfile: bots/ru/464-steam-monitor/Dockerfile
    container_name: botfarm-ru-464-steam-monitor
    restart: unless-stopped
    env_file: .env
    ports:
      - "9463:9463"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
