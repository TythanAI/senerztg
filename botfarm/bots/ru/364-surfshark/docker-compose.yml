# Build from the botfarm root:  docker compose -f bots/ru/364-surfshark/docker-compose.yml up -d
services:
  botfarm-ru-364-surfshark:
    build:
      context: ../../..
      dockerfile: bots/ru/364-surfshark/Dockerfile
    container_name: botfarm-ru-364-surfshark
    restart: unless-stopped
    env_file: .env
    ports:
      - "9363:9363"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
