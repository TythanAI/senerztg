# Build from the botfarm root:  docker compose -f bots/ru/131-locksmith-24/docker-compose.yml up -d
services:
  botfarm-ru-locksmith-24:
    build:
      context: ../../..
      dockerfile: bots/ru/131-locksmith-24/Dockerfile
    container_name: botfarm-ru-locksmith-24
    restart: unless-stopped
    env_file: .env
    ports:
      - "9130:9130"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
