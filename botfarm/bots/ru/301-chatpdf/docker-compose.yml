# Build from the botfarm root:  docker compose -f bots/ru/301-chatpdf/docker-compose.yml up -d
services:
  botfarm-ru-301-chatpdf:
    build:
      context: ../../..
      dockerfile: bots/ru/301-chatpdf/Dockerfile
    container_name: botfarm-ru-301-chatpdf
    restart: unless-stopped
    env_file: .env
    ports:
      - "9300:9300"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
