# Build from the botfarm root:  docker compose -f bots/ru/437-clash-gems/docker-compose.yml up -d
services:
  botfarm-ru-437-clash-gems:
    build:
      context: ../../..
      dockerfile: bots/ru/437-clash-gems/Dockerfile
    container_name: botfarm-ru-437-clash-gems
    restart: unless-stopped
    env_file: .env
    ports:
      - "9436:9436"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
