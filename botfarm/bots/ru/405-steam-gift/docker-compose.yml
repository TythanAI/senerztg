# Build from the botfarm root:  docker compose -f bots/ru/405-steam-gift/docker-compose.yml up -d
services:
  botfarm-ru-405-steam-gift:
    build:
      context: ../../..
      dockerfile: bots/ru/405-steam-gift/Dockerfile
    container_name: botfarm-ru-405-steam-gift
    restart: unless-stopped
    env_file: .env
    ports:
      - "9404:9404"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
