# Build from the botfarm root:  docker compose -f bots/ru/337-yandex-disk/docker-compose.yml up -d
services:
  botfarm-ru-337-yandex-disk:
    build:
      context: ../../..
      dockerfile: bots/ru/337-yandex-disk/Dockerfile
    container_name: botfarm-ru-337-yandex-disk
    restart: unless-stopped
    env_file: .env
    ports:
      - "9336:9336"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
