# Build from the botfarm root:  docker compose -f bots/ru/221-brawl-stars/docker-compose.yml up -d
services:
  botfarm-ru-221-brawl-stars:
    build:
      context: ../../..
      dockerfile: bots/ru/221-brawl-stars/Dockerfile
    container_name: botfarm-ru-221-brawl-stars
    restart: unless-stopped
    env_file: .env
    ports:
      - "9220:9220"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
