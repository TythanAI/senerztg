# Build from the botfarm root:  docker compose -f bots/ru/407-xbox-card/docker-compose.yml up -d
services:
  botfarm-ru-407-xbox-card:
    build:
      context: ../../..
      dockerfile: bots/ru/407-xbox-card/Dockerfile
    container_name: botfarm-ru-407-xbox-card
    restart: unless-stopped
    env_file: .env
    ports:
      - "9406:9406"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
