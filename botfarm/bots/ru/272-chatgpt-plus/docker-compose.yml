# Build from the botfarm root:  docker compose -f bots/ru/272-chatgpt-plus/docker-compose.yml up -d
services:
  botfarm-ru-272-chatgpt-plus:
    build:
      context: ../../..
      dockerfile: bots/ru/272-chatgpt-plus/Dockerfile
    container_name: botfarm-ru-272-chatgpt-plus
    restart: unless-stopped
    env_file: .env
    ports:
      - "9271:9271"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
