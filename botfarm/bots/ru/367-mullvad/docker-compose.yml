# Build from the botfarm root:  docker compose -f bots/ru/367-mullvad/docker-compose.yml up -d
services:
  botfarm-ru-367-mullvad:
    build:
      context: ../../..
      dockerfile: bots/ru/367-mullvad/Dockerfile
    container_name: botfarm-ru-367-mullvad
    restart: unless-stopped
    env_file: .env
    ports:
      - "9366:9366"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
