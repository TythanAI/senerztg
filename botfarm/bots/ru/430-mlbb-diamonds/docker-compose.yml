# Build from the botfarm root:  docker compose -f bots/ru/430-mlbb-diamonds/docker-compose.yml up -d
services:
  botfarm-ru-430-mlbb-diamonds:
    build:
      context: ../../..
      dockerfile: bots/ru/430-mlbb-diamonds/Dockerfile
    container_name: botfarm-ru-430-mlbb-diamonds
    restart: unless-stopped
    env_file: .env
    ports:
      - "9429:9429"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
