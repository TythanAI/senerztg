# Build from the botfarm root:  docker compose -f bots/ru/104-devops-lab/docker-compose.yml up -d
services:
  botfarm-ru-devops-lab:
    build:
      context: ../../..
      dockerfile: bots/ru/104-devops-lab/Dockerfile
    container_name: botfarm-ru-devops-lab
    restart: unless-stopped
    env_file: .env
    ports:
      - "9103:9103"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
