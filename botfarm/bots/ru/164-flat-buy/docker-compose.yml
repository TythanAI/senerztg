# Build from the botfarm root:  docker compose -f bots/ru/164-flat-buy/docker-compose.yml up -d
services:
  botfarm-ru-164-flat-buy:
    build:
      context: ../../..
      dockerfile: bots/ru/164-flat-buy/Dockerfile
    container_name: botfarm-ru-164-flat-buy
    restart: unless-stopped
    env_file: .env
    ports:
      - "9163:9163"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
