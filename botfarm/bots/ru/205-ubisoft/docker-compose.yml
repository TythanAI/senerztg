# Build from the botfarm root:  docker compose -f bots/ru/205-ubisoft/docker-compose.yml up -d
services:
  botfarm-ru-205-ubisoft:
    build:
      context: ../../..
      dockerfile: bots/ru/205-ubisoft/Dockerfile
    container_name: botfarm-ru-205-ubisoft
    restart: unless-stopped
    env_file: .env
    ports:
      - "9204:9204"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
