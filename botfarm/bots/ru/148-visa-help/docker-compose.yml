# Build from the botfarm root:  docker compose -f bots/ru/148-visa-help/docker-compose.yml up -d
services:
  botfarm-ru-148-visa-help:
    build:
      context: ../../..
      dockerfile: bots/ru/148-visa-help/Dockerfile
    container_name: botfarm-ru-148-visa-help
    restart: unless-stopped
    env_file: .env
    ports:
      - "9147:9147"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
