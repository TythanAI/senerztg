# Build from the botfarm root:  docker compose -f bots/ru/140-wine-club/docker-compose.yml up -d
services:
  botfarm-ru-140-wine-club:
    build:
      context: ../../..
      dockerfile: bots/ru/140-wine-club/Dockerfile
    container_name: botfarm-ru-140-wine-club
    restart: unless-stopped
    env_file: .env
    ports:
      - "9139:9139"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
