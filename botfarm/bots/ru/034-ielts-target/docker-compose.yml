# Build from the botfarm root:  docker compose -f bots/ru/034-ielts-target/docker-compose.yml up -d
services:
  botfarm-ru-ielts-target:
    build:
      context: ../../..
      dockerfile: bots/ru/034-ielts-target/Dockerfile
    container_name: botfarm-ru-ielts-target
    restart: unless-stopped
    env_file: .env
    ports:
      - "9033:9033"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
