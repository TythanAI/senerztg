# Build from the botfarm root:  docker compose -f bots/ru/244-netflix/docker-compose.yml up -d
services:
  botfarm-ru-244-netflix:
    build:
      context: ../../..
      dockerfile: bots/ru/244-netflix/Dockerfile
    container_name: botfarm-ru-244-netflix
    restart: unless-stopped
    env_file: .env
    ports:
      - "9243:9243"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
