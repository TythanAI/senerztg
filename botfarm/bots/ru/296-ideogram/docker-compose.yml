# Build from the botfarm root:  docker compose -f bots/ru/296-ideogram/docker-compose.yml up -d
services:
  botfarm-ru-296-ideogram:
    build:
      context: ../../..
      dockerfile: bots/ru/296-ideogram/Dockerfile
    container_name: botfarm-ru-296-ideogram
    restart: unless-stopped
    env_file: .env
    ports:
      - "9295:9295"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
