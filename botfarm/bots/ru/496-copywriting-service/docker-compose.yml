# Build from the botfarm root:  docker compose -f bots/ru/496-copywriting-service/docker-compose.yml up -d
services:
  botfarm-ru-496-copywriting-service:
    build:
      context: ../../..
      dockerfile: bots/ru/496-copywriting-service/Dockerfile
    container_name: botfarm-ru-496-copywriting-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "9495:9495"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
