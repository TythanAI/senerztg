# Build from the botfarm root:  docker compose -f bots/ru/085-avito-flow/docker-compose.yml up -d
services:
  botfarm-ru-avito-flow:
    build:
      context: ../../..
      dockerfile: bots/ru/085-avito-flow/Dockerfile
    container_name: botfarm-ru-avito-flow
    restart: unless-stopped
    env_file: .env
    ports:
      - "9084:9084"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
