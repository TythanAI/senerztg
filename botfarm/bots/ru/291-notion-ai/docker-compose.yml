# Build from the botfarm root:  docker compose -f bots/ru/291-notion-ai/docker-compose.yml up -d
services:
  botfarm-ru-291-notion-ai:
    build:
      context: ../../..
      dockerfile: bots/ru/291-notion-ai/Dockerfile
    container_name: botfarm-ru-291-notion-ai
    restart: unless-stopped
    env_file: .env
    ports:
      - "9290:9290"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
