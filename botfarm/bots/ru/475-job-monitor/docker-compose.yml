# Build from the botfarm root:  docker compose -f bots/ru/475-job-monitor/docker-compose.yml up -d
services:
  botfarm-ru-475-job-monitor:
    build:
      context: ../../..
      dockerfile: bots/ru/475-job-monitor/Dockerfile
    container_name: botfarm-ru-475-job-monitor
    restart: unless-stopped
    env_file: .env
    ports:
      - "9474:9474"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
