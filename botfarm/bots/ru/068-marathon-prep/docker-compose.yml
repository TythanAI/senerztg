# Build from the botfarm root:  docker compose -f bots/ru/068-marathon-prep/docker-compose.yml up -d
services:
  botfarm-ru-068-marathon-prep:
    build:
      context: ../../..
      dockerfile: bots/ru/068-marathon-prep/Dockerfile
    container_name: botfarm-ru-068-marathon-prep
    restart: unless-stopped
    env_file: .env
    ports:
      - "9067:9067"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
