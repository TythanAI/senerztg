# Build from the botfarm root:  docker compose -f bots/ru/314-threads/docker-compose.yml up -d
services:
  botfarm-ru-314-threads:
    build:
      context: ../../..
      dockerfile: bots/ru/314-threads/Dockerfile
    container_name: botfarm-ru-314-threads
    restart: unless-stopped
    env_file: .env
    ports:
      - "9313:9313"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
