# Build from the botfarm root:  docker compose -f bots/ru/345-figma/docker-compose.yml up -d
services:
  botfarm-ru-345-figma:
    build:
      context: ../../..
      dockerfile: bots/ru/345-figma/Dockerfile
    container_name: botfarm-ru-345-figma
    restart: unless-stopped
    env_file: .env
    ports:
      - "9344:9344"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
