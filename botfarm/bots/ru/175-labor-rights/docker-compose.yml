# Build from the botfarm root:  docker compose -f bots/ru/175-labor-rights/docker-compose.yml up -d
services:
  botfarm-ru-labor-rights:
    build:
      context: ../../..
      dockerfile: bots/ru/175-labor-rights/Dockerfile
    container_name: botfarm-ru-labor-rights
    restart: unless-stopped
    env_file: .env
    ports:
      - "9174:9174"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
