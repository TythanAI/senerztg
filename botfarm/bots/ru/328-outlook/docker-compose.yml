# Build from the botfarm root:  docker compose -f bots/ru/328-outlook/docker-compose.yml up -d
services:
  botfarm-ru-328-outlook:
    build:
      context: ../../..
      dockerfile: bots/ru/328-outlook/Dockerfile
    container_name: botfarm-ru-328-outlook
    restart: unless-stopped
    env_file: .env
    ports:
      - "9327:9327"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
