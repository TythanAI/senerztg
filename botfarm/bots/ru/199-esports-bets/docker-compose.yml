# Build from the botfarm root:  docker compose -f bots/ru/199-esports-bets/docker-compose.yml up -d
services:
  botfarm-ru-esports-bets:
    build:
      context: ../../..
      dockerfile: bots/ru/199-esports-bets/Dockerfile
    container_name: botfarm-ru-esports-bets
    restart: unless-stopped
    env_file: .env
    ports:
      - "9198:9198"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
