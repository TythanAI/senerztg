# Build from the botfarm root:  docker compose -f bots/ru/260-premier/docker-compose.yml up -d
services:
  botfarm-ru-260-premier:
    build:
      context: ../../..
      dockerfile: bots/ru/260-premier/Dockerfile
    container_name: botfarm-ru-260-premier
    restart: unless-stopped
    env_file: .env
    ports:
      - "9259:9259"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
