# Build from the botfarm root:  docker compose -f bots/ru/025-p2p-arbitrage/docker-compose.yml up -d
services:
  botfarm-ru-025-p2p-arbitrage:
    build:
      context: ../../..
      dockerfile: bots/ru/025-p2p-arbitrage/Dockerfile
    container_name: botfarm-ru-025-p2p-arbitrage
    restart: unless-stopped
    env_file: .env
    ports:
      - "9024:9024"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
