# Build from the botfarm root:  docker compose -f bots/ru/366-cyberghost/docker-compose.yml up -d
services:
  botfarm-ru-366-cyberghost:
    build:
      context: ../../..
      dockerfile: bots/ru/366-cyberghost/Dockerfile
    container_name: botfarm-ru-366-cyberghost
    restart: unless-stopped
    env_file: .env
    ports:
      - "9365:9365"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
