# Build from the botfarm root:  docker compose -f bots/ru/133-photo-school/docker-compose.yml up -d
services:
  botfarm-ru-photo-school:
    build:
      context: ../../..
      dockerfile: bots/ru/133-photo-school/Dockerfile
    container_name: botfarm-ru-photo-school
    restart: unless-stopped
    env_file: .env
    ports:
      - "9132:9132"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
