# Build from the botfarm root:  docker compose -f bots/ru/197-fifa-trade/docker-compose.yml up -d
services:
  botfarm-ru-fifa-trade:
    build:
      context: ../../..
      dockerfile: bots/ru/197-fifa-trade/Dockerfile
    container_name: botfarm-ru-fifa-trade
    restart: unless-stopped
    env_file: .env
    ports:
      - "9196:9196"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
