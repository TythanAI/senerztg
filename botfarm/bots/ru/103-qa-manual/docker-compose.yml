# Build from the botfarm root:  docker compose -f bots/ru/103-qa-manual/docker-compose.yml up -d
services:
  botfarm-ru-103-qa-manual:
    build:
      context: ../../..
      dockerfile: bots/ru/103-qa-manual/Dockerfile
    container_name: botfarm-ru-103-qa-manual
    restart: unless-stopped
    env_file: .env
    ports:
      - "9102:9102"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
