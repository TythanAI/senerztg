# Build from the botfarm root:  docker compose -f bots/ru/203-battlenet/docker-compose.yml up -d
services:
  botfarm-ru-203-battlenet:
    build:
      context: ../../..
      dockerfile: bots/ru/203-battlenet/Dockerfile
    container_name: botfarm-ru-203-battlenet
    restart: unless-stopped
    env_file: .env
    ports:
      - "9202:9202"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
