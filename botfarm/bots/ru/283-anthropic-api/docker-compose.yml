# Build from the botfarm root:  docker compose -f bots/ru/283-anthropic-api/docker-compose.yml up -d
services:
  botfarm-ru-283-anthropic-api:
    build:
      context: ../../..
      dockerfile: bots/ru/283-anthropic-api/Dockerfile
    container_name: botfarm-ru-283-anthropic-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "9282:9282"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
