# Build from the botfarm root:  docker compose -f bots/ru/336-onedrive/docker-compose.yml up -d
services:
  botfarm-ru-336-onedrive:
    build:
      context: ../../..
      dockerfile: bots/ru/336-onedrive/Dockerfile
    container_name: botfarm-ru-336-onedrive
    restart: unless-stopped
    env_file: .env
    ports:
      - "9335:9335"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
