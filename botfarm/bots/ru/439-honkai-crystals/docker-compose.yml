# Build from the botfarm root:  docker compose -f bots/ru/439-honkai-crystals/docker-compose.yml up -d
services:
  botfarm-ru-439-honkai-crystals:
    build:
      context: ../../..
      dockerfile: bots/ru/439-honkai-crystals/Dockerfile
    container_name: botfarm-ru-439-honkai-crystals
    restart: unless-stopped
    env_file: .env
    ports:
      - "9438:9438"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
