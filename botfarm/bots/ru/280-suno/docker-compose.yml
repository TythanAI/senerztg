# Build from the botfarm root:  docker compose -f bots/ru/280-suno/docker-compose.yml up -d
services:
  botfarm-ru-280-suno:
    build:
      context: ../../..
      dockerfile: bots/ru/280-suno/Dockerfile
    container_name: botfarm-ru-280-suno
    restart: unless-stopped
    env_file: .env
    ports:
      - "9279:9279"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
