# Build from the botfarm root:  docker compose -f bots/ru/287-descript/docker-compose.yml up -d
services:
  botfarm-ru-287-descript:
    build:
      context: ../../..
      dockerfile: bots/ru/287-descript/Dockerfile
    container_name: botfarm-ru-287-descript
    restart: unless-stopped
    env_file: .env
    ports:
      - "9286:9286"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
