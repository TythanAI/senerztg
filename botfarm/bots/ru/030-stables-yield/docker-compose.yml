# Build from the botfarm root:  docker compose -f bots/ru/030-stables-yield/docker-compose.yml up -d
services:
  botfarm-ru-stables-yield:
    build:
      context: ../../..
      dockerfile: bots/ru/030-stables-yield/Dockerfile
    container_name: botfarm-ru-stables-yield
    restart: unless-stopped
    env_file: .env
    ports:
      - "9029:9029"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
