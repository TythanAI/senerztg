# Build from the botfarm root:  docker compose -f bots/ru/236-wow/docker-compose.yml up -d
services:
  botfarm-ru-236-wow:
    build:
      context: ../../..
      dockerfile: bots/ru/236-wow/Dockerfile
    container_name: botfarm-ru-236-wow
    restart: unless-stopped
    env_file: .env
    ports:
      - "9235:9235"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
