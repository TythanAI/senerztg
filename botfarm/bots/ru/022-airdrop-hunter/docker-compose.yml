# Build from the botfarm root:  docker compose -f bots/ru/022-airdrop-hunter/docker-compose.yml up -d
services:
  botfarm-ru-022-airdrop-hunter:
    build:
      context: ../../..
      dockerfile: bots/ru/022-airdrop-hunter/Dockerfile
    container_name: botfarm-ru-022-airdrop-hunter
    restart: unless-stopped
    env_file: .env
    ports:
      - "9021:9021"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
