# Build from the botfarm root:  docker compose -f bots/ru/058-yoga-daily/docker-compose.yml up -d
services:
  botfarm-ru-058-yoga-daily:
    build:
      context: ../../..
      dockerfile: bots/ru/058-yoga-daily/Dockerfile
    container_name: botfarm-ru-058-yoga-daily
    restart: unless-stopped
    env_file: .env
    ports:
      - "9057:9057"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
