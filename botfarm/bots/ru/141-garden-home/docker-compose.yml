# Build from the botfarm root:  docker compose -f bots/ru/141-garden-home/docker-compose.yml up -d
services:
  botfarm-ru-141-garden-home:
    build:
      context: ../../..
      dockerfile: bots/ru/141-garden-home/Dockerfile
    container_name: botfarm-ru-141-garden-home
    restart: unless-stopped
    env_file: .env
    ports:
      - "9140:9140"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
