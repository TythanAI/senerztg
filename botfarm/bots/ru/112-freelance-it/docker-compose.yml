# Build from the botfarm root:  docker compose -f bots/ru/112-freelance-it/docker-compose.yml up -d
services:
  botfarm-ru-112-freelance-it:
    build:
      context: ../../..
      dockerfile: bots/ru/112-freelance-it/Dockerfile
    container_name: botfarm-ru-112-freelance-it
    restart: unless-stopped
    env_file: .env
    ports:
      - "9111:9111"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
