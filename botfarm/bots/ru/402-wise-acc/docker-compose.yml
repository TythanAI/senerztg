# Build from the botfarm root:  docker compose -f bots/ru/402-wise-acc/docker-compose.yml up -d
services:
  botfarm-ru-402-wise-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/402-wise-acc/Dockerfile
    container_name: botfarm-ru-402-wise-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9401:9401"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
