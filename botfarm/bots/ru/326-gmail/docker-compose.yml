# Build from the botfarm root:  docker compose -f bots/ru/326-gmail/docker-compose.yml up -d
services:
  botfarm-ru-326-gmail:
    build:
      context: ../../..
      dockerfile: bots/ru/326-gmail/Dockerfile
    container_name: botfarm-ru-326-gmail
    restart: unless-stopped
    env_file: .env
    ports:
      - "9325:9325"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
