# Build from the botfarm root:  docker compose -f bots/ru/255-twitch/docker-compose.yml up -d
services:
  botfarm-ru-255-twitch:
    build:
      context: ../../..
      dockerfile: bots/ru/255-twitch/Dockerfile
    container_name: botfarm-ru-255-twitch
    restart: unless-stopped
    env_file: .env
    ports:
      - "9254:9254"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
