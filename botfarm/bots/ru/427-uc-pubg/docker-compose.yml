# Build from the botfarm root:  docker compose -f bots/ru/427-uc-pubg/docker-compose.yml up -d
services:
  botfarm-ru-427-uc-pubg:
    build:
      context: ../../..
      dockerfile: bots/ru/427-uc-pubg/Dockerfile
    container_name: botfarm-ru-427-uc-pubg
    restart: unless-stopped
    env_file: .env
    ports:
      - "9426:9426"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
