# Build from the botfarm root:  docker compose -f bots/ru/257-ivi/docker-compose.yml up -d
services:
  botfarm-ru-257-ivi:
    build:
      context: ../../..
      dockerfile: bots/ru/257-ivi/Dockerfile
    container_name: botfarm-ru-257-ivi
    restart: unless-stopped
    env_file: .env
    ports:
      - "9256:9256"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
