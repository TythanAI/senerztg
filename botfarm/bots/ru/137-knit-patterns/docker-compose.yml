# Build from the botfarm root:  docker compose -f bots/ru/137-knit-patterns/docker-compose.yml up -d
services:
  botfarm-ru-137-knit-patterns:
    build:
      context: ../../..
      dockerfile: bots/ru/137-knit-patterns/Dockerfile
    container_name: botfarm-ru-137-knit-patterns
    restart: unless-stopped
    env_file: .env
    ports:
      - "9136:9136"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
