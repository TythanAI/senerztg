# Build from the botfarm root:  docker compose -f bots/ru/489-node-hosting/docker-compose.yml up -d
services:
  botfarm-ru-489-node-hosting:
    build:
      context: ../../..
      dockerfile: bots/ru/489-node-hosting/Dockerfile
    container_name: botfarm-ru-489-node-hosting
    restart: unless-stopped
    env_file: .env
    ports:
      - "9488:9488"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
