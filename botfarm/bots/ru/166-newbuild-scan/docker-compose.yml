# Build from the botfarm root:  docker compose -f bots/ru/166-newbuild-scan/docker-compose.yml up -d
services:
  botfarm-ru-166-newbuild-scan:
    build:
      context: ../../..
      dockerfile: bots/ru/166-newbuild-scan/Dockerfile
    container_name: botfarm-ru-166-newbuild-scan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9165:9165"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
