# Build from the botfarm root:  docker compose -f bots/ru/303-discord/docker-compose.yml up -d
services:
  botfarm-ru-303-discord:
    build:
      context: ../../..
      dockerfile: bots/ru/303-discord/Dockerfile
    container_name: botfarm-ru-303-discord
    restart: unless-stopped
    env_file: .env
    ports:
      - "9302:9302"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
