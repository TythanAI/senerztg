# Build from the botfarm root:  docker compose -f bots/ru/438-roblox-premium/docker-compose.yml up -d
services:
  botfarm-ru-438-roblox-premium:
    build:
      context: ../../..
      dockerfile: bots/ru/438-roblox-premium/Dockerfile
    container_name: botfarm-ru-438-roblox-premium
    restart: unless-stopped
    env_file: .env
    ports:
      - "9437:9437"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
