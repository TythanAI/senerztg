# Build from the botfarm root:  docker compose -f bots/ru/361-linkedin-learning/docker-compose.yml up -d
services:
  botfarm-ru-361-linkedin-learning:
    build:
      context: ../../..
      dockerfile: bots/ru/361-linkedin-learning/Dockerfile
    container_name: botfarm-ru-361-linkedin-learning
    restart: unless-stopped
    env_file: .env
    ports:
      - "9360:9360"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
