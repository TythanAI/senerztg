# Build from the botfarm root:  docker compose -f bots/ru/247-disney-plus/docker-compose.yml up -d
services:
  botfarm-ru-247-disney-plus:
    build:
      context: ../../..
      dockerfile: bots/ru/247-disney-plus/Dockerfile
    container_name: botfarm-ru-247-disney-plus
    restart: unless-stopped
    env_file: .env
    ports:
      - "9246:9246"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
