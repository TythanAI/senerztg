# Build from the botfarm root:  docker compose -f bots/ru/181-burnout-fix/docker-compose.yml up -d
services:
  botfarm-ru-burnout-fix:
    build:
      context: ../../..
      dockerfile: bots/ru/181-burnout-fix/Dockerfile
    container_name: botfarm-ru-burnout-fix
    restart: unless-stopped
    env_file: .env
    ports:
      - "9180:9180"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
