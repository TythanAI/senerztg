# Build from the botfarm root:  docker compose -f bots/ru/420-roblox-card/docker-compose.yml up -d
services:
  botfarm-ru-420-roblox-card:
    build:
      context: ../../..
      dockerfile: bots/ru/420-roblox-card/Dockerfile
    container_name: botfarm-ru-420-roblox-card
    restart: unless-stopped
    env_file: .env
    ports:
      - "9419:9419"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
