# Build from the botfarm root:  docker compose -f bots/ru/016-realty-invest/docker-compose.yml up -d
services:
  botfarm-ru-016-realty-invest:
    build:
      context: ../../..
      dockerfile: bots/ru/016-realty-invest/Dockerfile
    container_name: botfarm-ru-016-realty-invest
    restart: unless-stopped
    env_file: .env
    ports:
      - "9015:9015"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
