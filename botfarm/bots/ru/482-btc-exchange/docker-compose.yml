# Build from the botfarm root:  docker compose -f bots/ru/482-btc-exchange/docker-compose.yml up -d
services:
  botfarm-ru-482-btc-exchange:
    build:
      context: ../../..
      dockerfile: bots/ru/482-btc-exchange/Dockerfile
    container_name: botfarm-ru-482-btc-exchange
    restart: unless-stopped
    env_file: .env
    ports:
      - "9481:9481"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
