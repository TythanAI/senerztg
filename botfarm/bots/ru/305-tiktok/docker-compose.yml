# Build from the botfarm root:  docker compose -f bots/ru/305-tiktok/docker-compose.yml up -d
services:
  botfarm-ru-305-tiktok:
    build:
      context: ../../..
      dockerfile: bots/ru/305-tiktok/Dockerfile
    container_name: botfarm-ru-305-tiktok
    restart: unless-stopped
    env_file: .env
    ports:
      - "9304:9304"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
