# Build from the botfarm root:  docker compose -f bots/ru/168-interior-design/docker-compose.yml up -d
services:
  botfarm-ru-168-interior-design:
    build:
      context: ../../..
      dockerfile: bots/ru/168-interior-design/Dockerfile
    container_name: botfarm-ru-168-interior-design
    restart: unless-stopped
    env_file: .env
    ports:
      - "9167:9167"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
