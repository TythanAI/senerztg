# Build from the botfarm root:  docker compose -f bots/ru/127-photo-book/docker-compose.yml up -d
services:
  botfarm-ru-127-photo-book:
    build:
      context: ../../..
      dockerfile: bots/ru/127-photo-book/Dockerfile
    container_name: botfarm-ru-127-photo-book
    restart: unless-stopped
    env_file: .env
    ports:
      - "9126:9126"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
