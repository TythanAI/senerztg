# Build from the botfarm root:  docker compose -f bots/ru/433-cod-points/docker-compose.yml up -d
services:
  botfarm-ru-433-cod-points:
    build:
      context: ../../..
      dockerfile: bots/ru/433-cod-points/Dockerfile
    container_name: botfarm-ru-433-cod-points
    restart: unless-stopped
    env_file: .env
    ports:
      - "9432:9432"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
