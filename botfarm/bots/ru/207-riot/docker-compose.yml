# Build from the botfarm root:  docker compose -f bots/ru/207-riot/docker-compose.yml up -d
services:
  botfarm-ru-207-riot:
    build:
      context: ../../..
      dockerfile: bots/ru/207-riot/Dockerfile
    container_name: botfarm-ru-207-riot
    restart: unless-stopped
    env_file: .env
    ports:
      - "9206:9206"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
