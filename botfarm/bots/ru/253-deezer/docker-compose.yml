# Build from the botfarm root:  docker compose -f bots/ru/253-deezer/docker-compose.yml up -d
services:
  botfarm-ru-253-deezer:
    build:
      context: ../../..
      dockerfile: bots/ru/253-deezer/Dockerfile
    container_name: botfarm-ru-253-deezer
    restart: unless-stopped
    env_file: .env
    ports:
      - "9252:9252"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
