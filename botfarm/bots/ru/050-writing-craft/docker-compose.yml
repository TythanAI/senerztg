# Build from the botfarm root:  docker compose -f bots/ru/050-writing-craft/docker-compose.yml up -d
services:
  botfarm-ru-050-writing-craft:
    build:
      context: ../../..
      dockerfile: bots/ru/050-writing-craft/Dockerfile
    container_name: botfarm-ru-050-writing-craft
    restart: unless-stopped
    env_file: .env
    ports:
      - "9049:9049"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
