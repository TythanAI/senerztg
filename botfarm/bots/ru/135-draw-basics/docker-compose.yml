# Build from the botfarm root:  docker compose -f bots/ru/135-draw-basics/docker-compose.yml up -d
services:
  botfarm-ru-135-draw-basics:
    build:
      context: ../../..
      dockerfile: bots/ru/135-draw-basics/Dockerfile
    container_name: botfarm-ru-135-draw-basics
    restart: unless-stopped
    env_file: .env
    ports:
      - "9134:9134"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
