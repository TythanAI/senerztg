# Build from the botfarm root:  docker compose -f bots/ru/240-tarkov/docker-compose.yml up -d
services:
  botfarm-ru-240-tarkov:
    build:
      context: ../../..
      dockerfile: bots/ru/240-tarkov/Dockerfile
    container_name: botfarm-ru-240-tarkov
    restart: unless-stopped
    env_file: .env
    ports:
      - "9239:9239"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
