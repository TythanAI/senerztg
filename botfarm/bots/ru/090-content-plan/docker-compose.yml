# Build from the botfarm root:  docker compose -f bots/ru/090-content-plan/docker-compose.yml up -d
services:
  botfarm-ru-090-content-plan:
    build:
      context: ../../..
      dockerfile: bots/ru/090-content-plan/Dockerfile
    container_name: botfarm-ru-090-content-plan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9089:9089"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
