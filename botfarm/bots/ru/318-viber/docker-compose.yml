# Build from the botfarm root:  docker compose -f bots/ru/318-viber/docker-compose.yml up -d
services:
  botfarm-ru-318-viber:
    build:
      context: ../../..
      dockerfile: bots/ru/318-viber/Dockerfile
    container_name: botfarm-ru-318-viber
    restart: unless-stopped
    env_file: .env
    ports:
      - "9317:9317"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
