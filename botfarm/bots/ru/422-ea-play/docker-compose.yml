# Build from the botfarm root:  docker compose -f bots/ru/422-ea-play/docker-compose.yml up -d
services:
  botfarm-ru-422-ea-play:
    build:
      context: ../../..
      dockerfile: bots/ru/422-ea-play/Dockerfile
    container_name: botfarm-ru-422-ea-play
    restart: unless-stopped
    env_file: .env
    ports:
      - "9421:9421"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
