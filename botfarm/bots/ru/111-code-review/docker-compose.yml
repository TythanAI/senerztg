# Build from the botfarm root:  docker compose -f bots/ru/111-code-review/docker-compose.yml up -d
services:
  botfarm-ru-111-code-review:
    build:
      context: ../../..
      dockerfile: bots/ru/111-code-review/Dockerfile
    container_name: botfarm-ru-111-code-review
    restart: unless-stopped
    env_file: .env
    ports:
      - "9110:9110"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
