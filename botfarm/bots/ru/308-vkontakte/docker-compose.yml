# Build from the botfarm root:  docker compose -f bots/ru/308-vkontakte/docker-compose.yml up -d
services:
  botfarm-ru-308-vkontakte:
    build:
      context: ../../..
      dockerfile: bots/ru/308-vkontakte/Dockerfile
    container_name: botfarm-ru-308-vkontakte
    restart: unless-stopped
    env_file: .env
    ports:
      - "9307:9307"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
