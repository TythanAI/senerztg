# Build from the botfarm root:  docker compose -f bots/ru/306-twitter-x/docker-compose.yml up -d
services:
  botfarm-ru-306-twitter-x:
    build:
      context: ../../..
      dockerfile: bots/ru/306-twitter-x/Dockerfile
    container_name: botfarm-ru-306-twitter-x
    restart: unless-stopped
    env_file: .env
    ports:
      - "9305:9305"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
