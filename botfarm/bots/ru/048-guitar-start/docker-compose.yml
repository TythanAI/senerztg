# Build from the botfarm root:  docker compose -f bots/ru/048-guitar-start/docker-compose.yml up -d
services:
  botfarm-ru-guitar-start:
    build:
      context: ../../..
      dockerfile: bots/ru/048-guitar-start/Dockerfile
    container_name: botfarm-ru-guitar-start
    restart: unless-stopped
    env_file: .env
    ports:
      - "9047:9047"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
