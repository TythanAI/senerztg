# Build from the botfarm root:  docker compose -f bots/ru/211-dota2/docker-compose.yml up -d
services:
  botfarm-ru-211-dota2:
    build:
      context: ../../..
      dockerfile: bots/ru/211-dota2/Dockerfile
    container_name: botfarm-ru-211-dota2
    restart: unless-stopped
    env_file: .env
    ports:
      - "9210:9210"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
