# Build from the botfarm root:  docker compose -f bots/ru/012-etf-portfolio/docker-compose.yml up -d
services:
  botfarm-ru-012-etf-portfolio:
    build:
      context: ../../..
      dockerfile: bots/ru/012-etf-portfolio/Dockerfile
    container_name: botfarm-ru-012-etf-portfolio
    restart: unless-stopped
    env_file: .env
    ports:
      - "9011:9011"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
