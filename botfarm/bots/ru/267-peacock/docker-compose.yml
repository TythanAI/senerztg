# Build from the botfarm root:  docker compose -f bots/ru/267-peacock/docker-compose.yml up -d
services:
  botfarm-ru-267-peacock:
    build:
      context: ../../..
      dockerfile: bots/ru/267-peacock/Dockerfile
    container_name: botfarm-ru-267-peacock
    restart: unless-stopped
    env_file: .env
    ports:
      - "9266:9266"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
