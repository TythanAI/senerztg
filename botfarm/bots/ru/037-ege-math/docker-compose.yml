# Build from the botfarm root:  docker compose -f bots/ru/037-ege-math/docker-compose.yml up -d
services:
  botfarm-ru-ege-math:
    build:
      context: ../../..
      dockerfile: bots/ru/037-ege-math/Dockerfile
    container_name: botfarm-ru-ege-math
    restart: unless-stopped
    env_file: .env
    ports:
      - "9036:9036"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
