# Build from the botfarm root:  docker compose -f bots/ru/114-linux-admin/docker-compose.yml up -d
services:
  botfarm-ru-linux-admin:
    build:
      context: ../../..
      dockerfile: bots/ru/114-linux-admin/Dockerfile
    container_name: botfarm-ru-linux-admin
    restart: unless-stopped
    env_file: .env
    ports:
      - "9113:9113"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
