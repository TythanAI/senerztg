# Build from the botfarm root:  docker compose -f bots/ru/484-cash-crypto/docker-compose.yml up -d
services:
  botfarm-ru-484-cash-crypto:
    build:
      context: ../../..
      dockerfile: bots/ru/484-cash-crypto/Dockerfile
    container_name: botfarm-ru-484-cash-crypto
    restart: unless-stopped
    env_file: .env
    ports:
      - "9483:9483"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
