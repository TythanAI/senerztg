# Build from the botfarm root:  docker compose -f bots/ru/279-elevenlabs/docker-compose.yml up -d
services:
  botfarm-ru-279-elevenlabs:
    build:
      context: ../../..
      dockerfile: bots/ru/279-elevenlabs/Dockerfile
    container_name: botfarm-ru-279-elevenlabs
    restart: unless-stopped
    env_file: .env
    ports:
      - "9278:9278"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
