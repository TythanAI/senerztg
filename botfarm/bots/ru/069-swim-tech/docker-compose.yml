# Build from the botfarm root:  docker compose -f bots/ru/069-swim-tech/docker-compose.yml up -d
services:
  botfarm-ru-swim-tech:
    build:
      context: ../../..
      dockerfile: bots/ru/069-swim-tech/Dockerfile
    container_name: botfarm-ru-swim-tech
    restart: unless-stopped
    env_file: .env
    ports:
      - "9068:9068"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
