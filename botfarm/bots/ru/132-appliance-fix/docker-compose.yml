# Build from the botfarm root:  docker compose -f bots/ru/132-appliance-fix/docker-compose.yml up -d
services:
  botfarm-ru-appliance-fix:
    build:
      context: ../../..
      dockerfile: bots/ru/132-appliance-fix/Dockerfile
    container_name: botfarm-ru-appliance-fix
    restart: unless-stopped
    env_file: .env
    ports:
      - "9131:9131"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
