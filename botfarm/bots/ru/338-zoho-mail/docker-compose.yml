# Build from the botfarm root:  docker compose -f bots/ru/338-zoho-mail/docker-compose.yml up -d
services:
  botfarm-ru-338-zoho-mail:
    build:
      context: ../../..
      dockerfile: bots/ru/338-zoho-mail/Dockerfile
    container_name: botfarm-ru-338-zoho-mail
    restart: unless-stopped
    env_file: .env
    ports:
      - "9337:9337"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
