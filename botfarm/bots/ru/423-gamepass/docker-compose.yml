# Build from the botfarm root:  docker compose -f bots/ru/423-gamepass/docker-compose.yml up -d
services:
  botfarm-ru-423-gamepass:
    build:
      context: ../../..
      dockerfile: bots/ru/423-gamepass/Dockerfile
    container_name: botfarm-ru-423-gamepass
    restart: unless-stopped
    env_file: .env
    ports:
      - "9422:9422"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
