# Build from the botfarm root:  docker compose -f bots/ru/066-senior-fit/docker-compose.yml up -d
services:
  botfarm-ru-066-senior-fit:
    build:
      context: ../../..
      dockerfile: bots/ru/066-senior-fit/Dockerfile
    container_name: botfarm-ru-066-senior-fit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9065:9065"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
