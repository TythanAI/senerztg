# Build from the botfarm root:  docker compose -f bots/ru/271-litres/docker-compose.yml up -d
services:
  botfarm-ru-271-litres:
    build:
      context: ../../..
      dockerfile: bots/ru/271-litres/Dockerfile
    container_name: botfarm-ru-271-litres
    restart: unless-stopped
    env_file: .env
    ports:
      - "9270:9270"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
