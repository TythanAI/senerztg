# Build from the botfarm root:  docker compose -f bots/ru/095-franchise-buy/docker-compose.yml up -d
services:
  botfarm-ru-095-franchise-buy:
    build:
      context: ../../..
      dockerfile: bots/ru/095-franchise-buy/Dockerfile
    container_name: botfarm-ru-095-franchise-buy
    restart: unless-stopped
    env_file: .env
    ports:
      - "9094:9094"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
