# Build from the botfarm root:  docker compose -f bots/ru/307-facebook/docker-compose.yml up -d
services:
  botfarm-ru-307-facebook:
    build:
      context: ../../..
      dockerfile: bots/ru/307-facebook/Dockerfile
    container_name: botfarm-ru-307-facebook
    restart: unless-stopped
    env_file: .env
    ports:
      - "9306:9306"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
