# Build from the botfarm root:  docker compose -f bots/ru/418-discord-nitro/docker-compose.yml up -d
services:
  botfarm-ru-418-discord-nitro:
    build:
      context: ../../..
      dockerfile: bots/ru/418-discord-nitro/Dockerfile
    container_name: botfarm-ru-418-discord-nitro
    restart: unless-stopped
    env_file: .env
    ports:
      - "9417:9417"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
