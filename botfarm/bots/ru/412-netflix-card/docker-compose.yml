# Build from the botfarm root:  docker compose -f bots/ru/412-netflix-card/docker-compose.yml up -d
services:
  botfarm-ru-412-netflix-card:
    build:
      context: ../../..
      dockerfile: bots/ru/412-netflix-card/Dockerfile
    container_name: botfarm-ru-412-netflix-card
    restart: unless-stopped
    env_file: .env
    ports:
      - "9411:9411"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
