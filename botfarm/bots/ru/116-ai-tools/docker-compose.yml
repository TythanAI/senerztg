# Build from the botfarm root:  docker compose -f bots/ru/116-ai-tools/docker-compose.yml up -d
services:
  botfarm-ru-ai-tools:
    build:
      context: ../../..
      dockerfile: bots/ru/116-ai-tools/Dockerfile
    container_name: botfarm-ru-ai-tools
    restart: unless-stopped
    env_file: .env
    ports:
      - "9115:9115"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
