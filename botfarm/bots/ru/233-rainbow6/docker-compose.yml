# Build from the botfarm root:  docker compose -f bots/ru/233-rainbow6/docker-compose.yml up -d
services:
  botfarm-ru-233-rainbow6:
    build:
      context: ../../..
      dockerfile: bots/ru/233-rainbow6/Dockerfile
    container_name: botfarm-ru-233-rainbow6
    restart: unless-stopped
    env_file: .env
    ports:
      - "9232:9232"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
