# Build from the botfarm root:  docker compose -f bots/ru/071-skin-care/docker-compose.yml up -d
services:
  botfarm-ru-skin-care:
    build:
      context: ../../..
      dockerfile: bots/ru/071-skin-care/Dockerfile
    container_name: botfarm-ru-skin-care
    restart: unless-stopped
    env_file: .env
    ports:
      - "9070:9070"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
