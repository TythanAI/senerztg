# Build from the botfarm root:  docker compose -f bots/ru/325-kwai/docker-compose.yml up -d
services:
  botfarm-ru-325-kwai:
    build:
      context: ../../..
      dockerfile: bots/ru/325-kwai/Dockerfile
    container_name: botfarm-ru-325-kwai
    restart: unless-stopped
    env_file: .env
    ports:
      - "9324:9324"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
