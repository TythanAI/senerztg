# Build from the botfarm root:  docker compose -f bots/ru/234-cod/docker-compose.yml up -d
services:
  botfarm-ru-234-cod:
    build:
      context: ../../..
      dockerfile: bots/ru/234-cod/Dockerfile
    container_name: botfarm-ru-234-cod
    restart: unless-stopped
    env_file: .env
    ports:
      - "9233:9233"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
