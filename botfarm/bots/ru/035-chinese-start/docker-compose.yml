# Build from the botfarm root:  docker compose -f bots/ru/035-chinese-start/docker-compose.yml up -d
services:
  botfarm-ru-035-chinese-start:
    build:
      context: ../../..
      dockerfile: bots/ru/035-chinese-start/Dockerfile
    container_name: botfarm-ru-035-chinese-start
    restart: unless-stopped
    env_file: .env
    ports:
      - "9034:9034"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
