# Build from the botfarm root:  docker compose -f bots/ru/080-tattoo-book/docker-compose.yml up -d
services:
  botfarm-ru-080-tattoo-book:
    build:
      context: ../../..
      dockerfile: bots/ru/080-tattoo-book/Dockerfile
    container_name: botfarm-ru-080-tattoo-book
    restart: unless-stopped
    env_file: .env
    ports:
      - "9079:9079"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
