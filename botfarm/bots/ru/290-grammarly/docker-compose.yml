# Build from the botfarm root:  docker compose -f bots/ru/290-grammarly/docker-compose.yml up -d
services:
  botfarm-ru-290-grammarly:
    build:
      context: ../../..
      dockerfile: bots/ru/290-grammarly/Dockerfile
    container_name: botfarm-ru-290-grammarly
    restart: unless-stopped
    env_file: .env
    ports:
      - "9289:9289"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
