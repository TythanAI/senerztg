# Build from the botfarm root:  docker compose -f bots/ru/174-accounting-out/docker-compose.yml up -d
services:
  botfarm-ru-174-accounting-out:
    build:
      context: ../../..
      dockerfile: bots/ru/174-accounting-out/Dockerfile
    container_name: botfarm-ru-174-accounting-out
    restart: unless-stopped
    env_file: .env
    ports:
      - "9173:9173"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
