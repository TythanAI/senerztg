# Build from the botfarm root:  docker compose -f bots/ru/167-dacha-build/docker-compose.yml up -d
services:
  botfarm-ru-167-dacha-build:
    build:
      context: ../../..
      dockerfile: bots/ru/167-dacha-build/Dockerfile
    container_name: botfarm-ru-167-dacha-build
    restart: unless-stopped
    env_file: .env
    ports:
      - "9166:9166"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
