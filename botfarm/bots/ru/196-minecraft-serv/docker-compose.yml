# Build from the botfarm root:  docker compose -f bots/ru/196-minecraft-serv/docker-compose.yml up -d
services:
  botfarm-ru-minecraft-serv:
    build:
      context: ../../..
      dockerfile: bots/ru/196-minecraft-serv/Dockerfile
    container_name: botfarm-ru-minecraft-serv
    restart: unless-stopped
    env_file: .env
    ports:
      - "9195:9195"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
