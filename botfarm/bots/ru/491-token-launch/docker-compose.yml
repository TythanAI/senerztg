# Build from the botfarm root:  docker compose -f bots/ru/491-token-launch/docker-compose.yml up -d
services:
  botfarm-ru-491-token-launch:
    build:
      context: ../../..
      dockerfile: bots/ru/491-token-launch/Dockerfile
    container_name: botfarm-ru-491-token-launch
    restart: unless-stopped
    env_file: .env
    ports:
      - "9490:9490"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
