# Build from the botfarm root:  docker compose -f bots/ru/375-wireguard/docker-compose.yml up -d
services:
  botfarm-ru-375-wireguard:
    build:
      context: ../../..
      dockerfile: bots/ru/375-wireguard/Dockerfile
    container_name: botfarm-ru-375-wireguard
    restart: unless-stopped
    env_file: .env
    ports:
      - "9374:9374"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
