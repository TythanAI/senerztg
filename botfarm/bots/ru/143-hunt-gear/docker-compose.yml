# Build from the botfarm root:  docker compose -f bots/ru/143-hunt-gear/docker-compose.yml up -d
services:
  botfarm-ru-143-hunt-gear:
    build:
      context: ../../..
      dockerfile: bots/ru/143-hunt-gear/Dockerfile
    container_name: botfarm-ru-143-hunt-gear
    restart: unless-stopped
    env_file: .env
    ports:
      - "9142:9142"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
