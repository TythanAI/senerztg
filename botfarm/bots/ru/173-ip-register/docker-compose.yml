# Build from the botfarm root:  docker compose -f bots/ru/173-ip-register/docker-compose.yml up -d
services:
  botfarm-ru-173-ip-register:
    build:
      context: ../../..
      dockerfile: bots/ru/173-ip-register/Dockerfile
    container_name: botfarm-ru-173-ip-register
    restart: unless-stopped
    env_file: .env
    ports:
      - "9172:9172"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
