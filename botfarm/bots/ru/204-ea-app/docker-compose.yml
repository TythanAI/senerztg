# Build from the botfarm root:  docker compose -f bots/ru/204-ea-app/docker-compose.yml up -d
services:
  botfarm-ru-204-ea-app:
    build:
      context: ../../..
      dockerfile: bots/ru/204-ea-app/Dockerfile
    container_name: botfarm-ru-204-ea-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "9203:9203"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
