# Build from the botfarm root:  docker compose -f bots/ru/299-deepl/docker-compose.yml up -d
services:
  botfarm-ru-299-deepl:
    build:
      context: ../../..
      dockerfile: bots/ru/299-deepl/Dockerfile
    container_name: botfarm-ru-299-deepl
    restart: unless-stopped
    env_file: .env
    ports:
      - "9298:9298"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
