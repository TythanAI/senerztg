# Build from the botfarm root:  docker compose -f bots/ru/432-standoff-gold/docker-compose.yml up -d
services:
  botfarm-ru-432-standoff-gold:
    build:
      context: ../../..
      dockerfile: bots/ru/432-standoff-gold/Dockerfile
    container_name: botfarm-ru-432-standoff-gold
    restart: unless-stopped
    env_file: .env
    ports:
      - "9431:9431"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
