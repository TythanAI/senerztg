# Build from the botfarm root:  docker compose -f bots/ru/393-ozon-acc/docker-compose.yml up -d
services:
  botfarm-ru-393-ozon-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/393-ozon-acc/Dockerfile
    container_name: botfarm-ru-393-ozon-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9392:9392"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
