# Build from the botfarm root:  docker compose -f bots/ru/353-miro/docker-compose.yml up -d
services:
  botfarm-ru-353-miro:
    build:
      context: ../../..
      dockerfile: bots/ru/353-miro/Dockerfile
    container_name: botfarm-ru-353-miro
    restart: unless-stopped
    env_file: .env
    ports:
      - "9352:9352"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
