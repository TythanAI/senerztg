# Build from the botfarm root:  docker compose -f bots/ru/350-zoom/docker-compose.yml up -d
services:
  botfarm-ru-350-zoom:
    build:
      context: ../../..
      dockerfile: bots/ru/350-zoom/Dockerfile
    container_name: botfarm-ru-350-zoom
    restart: unless-stopped
    env_file: .env
    ports:
      - "9349:9349"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
