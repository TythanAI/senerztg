# Build from the botfarm root:  docker compose -f bots/ru/186-habits-lab/docker-compose.yml up -d
services:
  botfarm-ru-habits-lab:
    build:
      context: ../../..
      dockerfile: bots/ru/186-habits-lab/Dockerfile
    container_name: botfarm-ru-habits-lab
    restart: unless-stopped
    env_file: .env
    ports:
      - "9185:9185"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
