# Build from the botfarm root:  docker compose -f bots/ru/032-trading-bots/docker-compose.yml up -d
services:
  botfarm-ru-trading-bots:
    build:
      context: ../../..
      dockerfile: bots/ru/032-trading-bots/Dockerfile
    container_name: botfarm-ru-trading-bots
    restart: unless-stopped
    env_file: .env
    ports:
      - "9031:9031"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
