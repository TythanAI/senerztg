# Build from the botfarm root:  docker compose -f bots/ru/124-garden-care/docker-compose.yml up -d
services:
  botfarm-ru-garden-care:
    build:
      context: ../../..
      dockerfile: bots/ru/124-garden-care/Dockerfile
    container_name: botfarm-ru-garden-care
    restart: unless-stopped
    env_file: .env
    ports:
      - "9123:9123"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
