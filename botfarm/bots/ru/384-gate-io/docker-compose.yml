# Build from the botfarm root:  docker compose -f bots/ru/384-gate-io/docker-compose.yml up -d
services:
  botfarm-ru-384-gate-io:
    build:
      context: ../../..
      dockerfile: bots/ru/384-gate-io/Dockerfile
    container_name: botfarm-ru-384-gate-io
    restart: unless-stopped
    env_file: .env
    ports:
      - "9383:9383"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
