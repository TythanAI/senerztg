# Build from the botfarm root:  docker compose -f bots/ru/413-spotify-card/docker-compose.yml up -d
services:
  botfarm-ru-413-spotify-card:
    build:
      context: ../../..
      dockerfile: bots/ru/413-spotify-card/Dockerfile
    container_name: botfarm-ru-413-spotify-card
    restart: unless-stopped
    env_file: .env
    ports:
      - "9412:9412"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
