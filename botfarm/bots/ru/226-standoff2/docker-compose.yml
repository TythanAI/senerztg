# Build from the botfarm root:  docker compose -f bots/ru/226-standoff2/docker-compose.yml up -d
services:
  botfarm-ru-226-standoff2:
    build:
      context: ../../..
      dockerfile: bots/ru/226-standoff2/Dockerfile
    container_name: botfarm-ru-226-standoff2
    restart: unless-stopped
    env_file: .env
    ports:
      - "9225:9225"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
