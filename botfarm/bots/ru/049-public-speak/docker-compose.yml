# Build from the botfarm root:  docker compose -f bots/ru/049-public-speak/docker-compose.yml up -d
services:
  botfarm-ru-public-speak:
    build:
      context: ../../..
      dockerfile: bots/ru/049-public-speak/Dockerfile
    container_name: botfarm-ru-public-speak
    restart: unless-stopped
    env_file: .env
    ports:
      - "9048:9048"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
