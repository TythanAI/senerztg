# Build from the botfarm root:  docker compose -f bots/ru/156-car-diag/docker-compose.yml up -d
services:
  botfarm-ru-car-diag:
    build:
      context: ../../..
      dockerfile: bots/ru/156-car-diag/Dockerfile
    container_name: botfarm-ru-car-diag
    restart: unless-stopped
    env_file: .env
    ports:
      - "9155:9155"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
