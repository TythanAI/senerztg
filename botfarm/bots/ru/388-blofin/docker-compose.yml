# Build from the botfarm root:  docker compose -f bots/ru/388-blofin/docker-compose.yml up -d
services:
  botfarm-ru-388-blofin:
    build:
      context: ../../..
      dockerfile: bots/ru/388-blofin/Dockerfile
    container_name: botfarm-ru-388-blofin
    restart: unless-stopped
    env_file: .env
    ports:
      - "9387:9387"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
