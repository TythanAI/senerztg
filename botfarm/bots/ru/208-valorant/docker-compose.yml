# Build from the botfarm root:  docker compose -f bots/ru/208-valorant/docker-compose.yml up -d
services:
  botfarm-ru-208-valorant:
    build:
      context: ../../..
      dockerfile: bots/ru/208-valorant/Dockerfile
    container_name: botfarm-ru-208-valorant
    restart: unless-stopped
    env_file: .env
    ports:
      - "9207:9207"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
