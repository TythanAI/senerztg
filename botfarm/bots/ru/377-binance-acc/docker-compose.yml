# Build from the botfarm root:  docker compose -f bots/ru/377-binance-acc/docker-compose.yml up -d
services:
  botfarm-ru-377-binance-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/377-binance-acc/Dockerfile
    container_name: botfarm-ru-377-binance-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9376:9376"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
