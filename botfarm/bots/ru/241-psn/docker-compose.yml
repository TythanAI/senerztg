# Build from the botfarm root:  docker compose -f bots/ru/241-psn/docker-compose.yml up -d
services:
  botfarm-ru-241-psn:
    build:
      context: ../../..
      dockerfile: bots/ru/241-psn/Dockerfile
    container_name: botfarm-ru-241-psn
    restart: unless-stopped
    env_file: .env
    ports:
      - "9240:9240"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
