# Build from the botfarm root:  docker compose -f bots/ru/041-speed-read/docker-compose.yml up -d
services:
  botfarm-ru-speed-read:
    build:
      context: ../../..
      dockerfile: bots/ru/041-speed-read/Dockerfile
    container_name: botfarm-ru-speed-read
    restart: unless-stopped
    env_file: .env
    ports:
      - "9040:9040"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
