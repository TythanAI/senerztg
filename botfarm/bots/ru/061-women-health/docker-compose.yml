# Build from the botfarm root:  docker compose -f bots/ru/061-women-health/docker-compose.yml up -d
services:
  botfarm-ru-061-women-health:
    build:
      context: ../../..
      dockerfile: bots/ru/061-women-health/Dockerfile
    container_name: botfarm-ru-061-women-health
    restart: unless-stopped
    env_file: .env
    ports:
      - "9060:9060"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
