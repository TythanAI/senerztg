# Build from the botfarm root:  docker compose -f bots/ru/201-steam/docker-compose.yml up -d
services:
  botfarm-ru-201-steam:
    build:
      context: ../../..
      dockerfile: bots/ru/201-steam/Dockerfile
    container_name: botfarm-ru-201-steam
    restart: unless-stopped
    env_file: .env
    ports:
      - "9200:9200"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
