# Build from the botfarm root:  docker compose -f bots/ru/059-sleep-fix/docker-compose.yml up -d
services:
  botfarm-ru-059-sleep-fix:
    build:
      context: ../../..
      dockerfile: bots/ru/059-sleep-fix/Dockerfile
    container_name: botfarm-ru-059-sleep-fix
    restart: unless-stopped
    env_file: .env
    ports:
      - "9058:9058"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
