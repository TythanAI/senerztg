# Build from the botfarm root:  docker compose -f bots/ru/354-envato/docker-compose.yml up -d
services:
  botfarm-ru-354-envato:
    build:
      context: ../../..
      dockerfile: bots/ru/354-envato/Dockerfile
    container_name: botfarm-ru-354-envato
    restart: unless-stopped
    env_file: .env
    ports:
      - "9353:9353"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
