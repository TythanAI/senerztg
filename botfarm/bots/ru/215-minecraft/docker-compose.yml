# Build from the botfarm root:  docker compose -f bots/ru/215-minecraft/docker-compose.yml up -d
services:
  botfarm-ru-215-minecraft:
    build:
      context: ../../..
      dockerfile: bots/ru/215-minecraft/Dockerfile
    container_name: botfarm-ru-215-minecraft
    restart: unless-stopped
    env_file: .env
    ports:
      - "9214:9214"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
