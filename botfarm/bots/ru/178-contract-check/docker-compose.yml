# Build from the botfarm root:  docker compose -f bots/ru/178-contract-check/docker-compose.yml up -d
services:
  botfarm-ru-contract-check:
    build:
      context: ../../..
      dockerfile: bots/ru/178-contract-check/Dockerfile
    container_name: botfarm-ru-contract-check
    restart: unless-stopped
    env_file: .env
    ports:
      - "9177:9177"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
