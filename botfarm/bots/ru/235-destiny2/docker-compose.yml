# Build from the botfarm root:  docker compose -f bots/ru/235-destiny2/docker-compose.yml up -d
services:
  botfarm-ru-235-destiny2:
    build:
      context: ../../..
      dockerfile: bots/ru/235-destiny2/Dockerfile
    container_name: botfarm-ru-235-destiny2
    restart: unless-stopped
    env_file: .env
    ports:
      - "9234:9234"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
