# Build from the botfarm root:  docker compose -f bots/ru/454-fifa-coins/docker-compose.yml up -d
services:
  botfarm-ru-454-fifa-coins:
    build:
      context: ../../..
      dockerfile: bots/ru/454-fifa-coins/Dockerfile
    container_name: botfarm-ru-454-fifa-coins
    restart: unless-stopped
    env_file: .env
    ports:
      - "9453:9453"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
