# Build from the botfarm root:  docker compose -f bots/ru/192-mobile-legends/docker-compose.yml up -d
services:
  botfarm-ru-192-mobile-legends:
    build:
      context: ../../..
      dockerfile: bots/ru/192-mobile-legends/Dockerfile
    container_name: botfarm-ru-192-mobile-legends
    restart: unless-stopped
    env_file: .env
    ports:
      - "9191:9191"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
