# Build from the botfarm root:  docker compose -f bots/ru/020-defi-farm/docker-compose.yml up -d
services:
  botfarm-ru-020-defi-farm:
    build:
      context: ../../..
      dockerfile: bots/ru/020-defi-farm/Dockerfile
    container_name: botfarm-ru-020-defi-farm
    restart: unless-stopped
    env_file: .env
    ports:
      - "9019:9019"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
