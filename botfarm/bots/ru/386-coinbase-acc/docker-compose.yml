# Build from the botfarm root:  docker compose -f bots/ru/386-coinbase-acc/docker-compose.yml up -d
services:
  botfarm-ru-386-coinbase-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/386-coinbase-acc/Dockerfile
    container_name: botfarm-ru-386-coinbase-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9385:9385"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
