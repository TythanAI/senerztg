# Build from the botfarm root:  docker compose -f bots/ru/334-google-drive/docker-compose.yml up -d
services:
  botfarm-ru-334-google-drive:
    build:
      context: ../../..
      dockerfile: bots/ru/334-google-drive/Dockerfile
    container_name: botfarm-ru-334-google-drive
    restart: unless-stopped
    env_file: .env
    ports:
      - "9333:9333"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
