# Build from the botfarm root:  docker compose -f bots/ru/262-vk-music/docker-compose.yml up -d
services:
  botfarm-ru-262-vk-music:
    build:
      context: ../../..
      dockerfile: bots/ru/262-vk-music/Dockerfile
    container_name: botfarm-ru-262-vk-music
    restart: unless-stopped
    env_file: .env
    ports:
      - "9261:9261"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
