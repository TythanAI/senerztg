# Build from the botfarm root:  docker compose -f bots/ru/047-music-theory/docker-compose.yml up -d
services:
  botfarm-ru-music-theory:
    build:
      context: ../../..
      dockerfile: bots/ru/047-music-theory/Dockerfile
    container_name: botfarm-ru-music-theory
    restart: unless-stopped
    env_file: .env
    ports:
      - "9046:9046"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
