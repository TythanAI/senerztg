# Build from the botfarm root:  docker compose -f bots/ru/269-dazn/docker-compose.yml up -d
services:
  botfarm-ru-269-dazn:
    build:
      context: ../../..
      dockerfile: bots/ru/269-dazn/Dockerfile
    container_name: botfarm-ru-269-dazn
    restart: unless-stopped
    env_file: .env
    ports:
      - "9268:9268"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
