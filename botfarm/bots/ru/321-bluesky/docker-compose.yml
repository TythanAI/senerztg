# Build from the botfarm root:  docker compose -f bots/ru/321-bluesky/docker-compose.yml up -d
services:
  botfarm-ru-321-bluesky:
    build:
      context: ../../..
      dockerfile: bots/ru/321-bluesky/Dockerfile
    container_name: botfarm-ru-321-bluesky
    restart: unless-stopped
    env_file: .env
    ports:
      - "9320:9320"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
