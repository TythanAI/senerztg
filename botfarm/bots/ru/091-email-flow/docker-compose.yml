# Build from the botfarm root:  docker compose -f bots/ru/091-email-flow/docker-compose.yml up -d
services:
  botfarm-ru-091-email-flow:
    build:
      context: ../../..
      dockerfile: bots/ru/091-email-flow/Dockerfile
    container_name: botfarm-ru-091-email-flow
    restart: unless-stopped
    env_file: .env
    ports:
      - "9090:9090"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
