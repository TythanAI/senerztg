# Build from the botfarm root:  docker compose -f bots/ru/099-local-biz/docker-compose.yml up -d
services:
  botfarm-ru-local-biz:
    build:
      context: ../../..
      dockerfile: bots/ru/099-local-biz/Dockerfile
    container_name: botfarm-ru-local-biz
    restart: unless-stopped
    env_file: .env
    ports:
      - "9098:9098"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
