# Build from the botfarm root:  docker compose -f bots/ru/250-apple-tv/docker-compose.yml up -d
services:
  botfarm-ru-250-apple-tv:
    build:
      context: ../../..
      dockerfile: bots/ru/250-apple-tv/Dockerfile
    container_name: botfarm-ru-250-apple-tv
    restart: unless-stopped
    env_file: .env
    ports:
      - "9249:9249"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
