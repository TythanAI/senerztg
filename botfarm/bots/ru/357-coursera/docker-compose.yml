# Build from the botfarm root:  docker compose -f bots/ru/357-coursera/docker-compose.yml up -d
services:
  botfarm-ru-357-coursera:
    build:
      context: ../../..
      dockerfile: bots/ru/357-coursera/Dockerfile
    container_name: botfarm-ru-357-coursera
    restart: unless-stopped
    env_file: .env
    ports:
      - "9356:9356"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
