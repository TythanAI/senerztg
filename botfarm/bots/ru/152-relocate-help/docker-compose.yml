# Build from the botfarm root:  docker compose -f bots/ru/152-relocate-help/docker-compose.yml up -d
services:
  botfarm-ru-152-relocate-help:
    build:
      context: ../../..
      dockerfile: bots/ru/152-relocate-help/Dockerfile
    container_name: botfarm-ru-152-relocate-help
    restart: unless-stopped
    env_file: .env
    ports:
      - "9151:9151"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
