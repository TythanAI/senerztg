# Build from the botfarm root:  docker compose -f bots/ru/008-pension-plan/docker-compose.yml up -d
services:
  botfarm-ru-008-pension-plan:
    build:
      context: ../../..
      dockerfile: bots/ru/008-pension-plan/Dockerfile
    container_name: botfarm-ru-008-pension-plan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9007:9007"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
