# Build from the botfarm root:  docker compose -f bots/ru/426-vbucks-topup/docker-compose.yml up -d
services:
  botfarm-ru-426-vbucks-topup:
    build:
      context: ../../..
      dockerfile: bots/ru/426-vbucks-topup/Dockerfile
    container_name: botfarm-ru-426-vbucks-topup
    restart: unless-stopped
    env_file: .env
    ports:
      - "9425:9425"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
