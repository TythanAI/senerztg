# Build from the botfarm root:  docker compose -f bots/ru/441-steam-wallet/docker-compose.yml up -d
services:
  botfarm-ru-441-steam-wallet:
    build:
      context: ../../..
      dockerfile: bots/ru/441-steam-wallet/Dockerfile
    container_name: botfarm-ru-441-steam-wallet
    restart: unless-stopped
    env_file: .env
    ports:
      - "9440:9440"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
