# Build from the botfarm root:  docker compose -f bots/ru/500-domain-service/docker-compose.yml up -d
services:
  botfarm-ru-500-domain-service:
    build:
      context: ../../..
      dockerfile: bots/ru/500-domain-service/Dockerfile
    container_name: botfarm-ru-500-domain-service
    restart: unless-stopped
    env_file: .env
    ports:
      - "9499:9499"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
