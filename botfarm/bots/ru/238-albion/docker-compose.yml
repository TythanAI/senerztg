# Build from the botfarm root:  docker compose -f bots/ru/238-albion/docker-compose.yml up -d
services:
  botfarm-ru-238-albion:
    build:
      context: ../../..
      dockerfile: bots/ru/238-albion/Dockerfile
    container_name: botfarm-ru-238-albion
    restart: unless-stopped
    env_file: .env
    ports:
      - "9237:9237"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
