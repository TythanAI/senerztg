# Build from the botfarm root:  docker compose -f bots/ru/194-steam-skins/docker-compose.yml up -d
services:
  botfarm-ru-194-steam-skins:
    build:
      context: ../../..
      dockerfile: bots/ru/194-steam-skins/Dockerfile
    container_name: botfarm-ru-194-steam-skins
    restart: unless-stopped
    env_file: .env
    ports:
      - "9193:9193"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
