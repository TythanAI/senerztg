# Build from the botfarm root:  docker compose -f bots/ru/014-options-desk/docker-compose.yml up -d
services:
  botfarm-ru-014-options-desk:
    build:
      context: ../../..
      dockerfile: bots/ru/014-options-desk/Dockerfile
    container_name: botfarm-ru-014-options-desk
    restart: unless-stopped
    env_file: .env
    ports:
      - "9013:9013"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
