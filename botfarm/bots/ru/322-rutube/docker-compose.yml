# Build from the botfarm root:  docker compose -f bots/ru/322-rutube/docker-compose.yml up -d
services:
  botfarm-ru-322-rutube:
    build:
      context: ../../..
      dockerfile: bots/ru/322-rutube/Dockerfile
    container_name: botfarm-ru-322-rutube
    restart: unless-stopped
    env_file: .env
    ports:
      - "9321:9321"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
