# Build from the botfarm root:  docker compose -f bots/ru/273-claude-pro/docker-compose.yml up -d
services:
  botfarm-ru-273-claude-pro:
    build:
      context: ../../..
      dockerfile: bots/ru/273-claude-pro/Dockerfile
    container_name: botfarm-ru-273-claude-pro
    restart: unless-stopped
    env_file: .env
    ports:
      - "9272:9272"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
