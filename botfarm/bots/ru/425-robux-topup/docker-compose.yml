# Build from the botfarm root:  docker compose -f bots/ru/425-robux-topup/docker-compose.yml up -d
services:
  botfarm-ru-425-robux-topup:
    build:
      context: ../../..
      dockerfile: bots/ru/425-robux-topup/Dockerfile
    container_name: botfarm-ru-425-robux-topup
    restart: unless-stopped
    env_file: .env
    ports:
      - "9424:9424"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
