# Build from the botfarm root:  docker compose -f bots/ru/487-crypto-tax-help/docker-compose.yml up -d
services:
  botfarm-ru-487-crypto-tax-help:
    build:
      context: ../../..
      dockerfile: bots/ru/487-crypto-tax-help/Dockerfile
    container_name: botfarm-ru-487-crypto-tax-help
    restart: unless-stopped
    env_file: .env
    ports:
      - "9486:9486"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
