# Build from the botfarm root:  docker compose -f bots/ru/086-sales-script/docker-compose.yml up -d
services:
  botfarm-ru-086-sales-script:
    build:
      context: ../../..
      dockerfile: bots/ru/086-sales-script/Dockerfile
    container_name: botfarm-ru-086-sales-script
    restart: unless-stopped
    env_file: .env
    ports:
      - "9085:9085"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
