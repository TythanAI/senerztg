# Build from the botfarm root:  docker compose -f bots/ru/004-trader-signals/docker-compose.yml up -d
services:
  botfarm-ru-trader-signals:
    build:
      context: ../../..
      dockerfile: bots/ru/004-trader-signals/Dockerfile
    container_name: botfarm-ru-trader-signals
    restart: unless-stopped
    env_file: .env
    ports:
      - "9003:9003"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
