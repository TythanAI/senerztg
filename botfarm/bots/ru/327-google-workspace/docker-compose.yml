# Build from the botfarm root:  docker compose -f bots/ru/327-google-workspace/docker-compose.yml up -d
services:
  botfarm-ru-327-google-workspace:
    build:
      context: ../../..
      dockerfile: bots/ru/327-google-workspace/Dockerfile
    container_name: botfarm-ru-327-google-workspace
    restart: unless-stopped
    env_file: .env
    ports:
      - "9326:9326"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
