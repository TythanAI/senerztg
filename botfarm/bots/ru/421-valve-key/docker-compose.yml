# Build from the botfarm root:  docker compose -f bots/ru/421-valve-key/docker-compose.yml up -d
services:
  botfarm-ru-421-valve-key:
    build:
      context: ../../..
      dockerfile: bots/ru/421-valve-key/Dockerfile
    container_name: botfarm-ru-421-valve-key
    restart: unless-stopped
    env_file: .env
    ports:
      - "9420:9420"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
