# Build from the botfarm root:  docker compose -f bots/ru/134-video-edit/docker-compose.yml up -d
services:
  botfarm-ru-video-edit:
    build:
      context: ../../..
      dockerfile: bots/ru/134-video-edit/Dockerfile
    container_name: botfarm-ru-video-edit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9133:9133"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
