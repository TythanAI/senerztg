# Build from the botfarm root:  docker compose -f bots/ru/097-import-china/docker-compose.yml up -d
services:
  botfarm-ru-097-import-china:
    build:
      context: ../../..
      dockerfile: bots/ru/097-import-china/Dockerfile
    container_name: botfarm-ru-097-import-china
    restart: unless-stopped
    env_file: .env
    ports:
      - "9096:9096"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
