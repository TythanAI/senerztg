# Build from the botfarm root:  docker compose -f bots/ru/198-poker-school/docker-compose.yml up -d
services:
  botfarm-ru-198-poker-school:
    build:
      context: ../../..
      dockerfile: bots/ru/198-poker-school/Dockerfile
    container_name: botfarm-ru-198-poker-school
    restart: unless-stopped
    env_file: .env
    ports:
      - "9197:9197"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
