# Build from the botfarm root:  docker compose -f bots/ru/121-electric-call/docker-compose.yml up -d
services:
  botfarm-ru-121-electric-call:
    build:
      context: ../../..
      dockerfile: bots/ru/121-electric-call/Dockerfile
    container_name: botfarm-ru-121-electric-call
    restart: unless-stopped
    env_file: .env
    ports:
      - "9120:9120"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
