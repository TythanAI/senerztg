# Build from the botfarm root:  docker compose -f bots/ru/093-landing-fast/docker-compose.yml up -d
services:
  botfarm-ru-093-landing-fast:
    build:
      context: ../../..
      dockerfile: bots/ru/093-landing-fast/Dockerfile
    container_name: botfarm-ru-093-landing-fast
    restart: unless-stopped
    env_file: .env
    ports:
      - "9092:9092"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
