# Build from the botfarm root:  docker compose -f bots/ru/094-hr-hiring/docker-compose.yml up -d
services:
  botfarm-ru-094-hr-hiring:
    build:
      context: ../../..
      dockerfile: bots/ru/094-hr-hiring/Dockerfile
    container_name: botfarm-ru-094-hr-hiring
    restart: unless-stopped
    env_file: .env
    ports:
      - "9093:9093"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
