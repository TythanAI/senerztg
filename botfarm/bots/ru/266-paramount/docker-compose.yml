# Build from the botfarm root:  docker compose -f bots/ru/266-paramount/docker-compose.yml up -d
services:
  botfarm-ru-266-paramount:
    build:
      context: ../../..
      dockerfile: bots/ru/266-paramount/Dockerfile
    container_name: botfarm-ru-266-paramount
    restart: unless-stopped
    env_file: .env
    ports:
      - "9265:9265"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
