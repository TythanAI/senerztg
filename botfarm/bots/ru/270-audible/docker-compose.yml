# Build from the botfarm root:  docker compose -f bots/ru/270-audible/docker-compose.yml up -d
services:
  botfarm-ru-270-audible:
    build:
      context: ../../..
      dockerfile: bots/ru/270-audible/Dockerfile
    container_name: botfarm-ru-270-audible
    restart: unless-stopped
    env_file: .env
    ports:
      - "9269:9269"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
