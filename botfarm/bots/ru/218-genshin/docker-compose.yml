# Build from the botfarm root:  docker compose -f bots/ru/218-genshin/docker-compose.yml up -d
services:
  botfarm-ru-218-genshin:
    build:
      context: ../../..
      dockerfile: bots/ru/218-genshin/Dockerfile
    container_name: botfarm-ru-218-genshin
    restart: unless-stopped
    env_file: .env
    ports:
      - "9217:9217"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
