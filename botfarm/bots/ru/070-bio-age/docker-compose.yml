# Build from the botfarm root:  docker compose -f bots/ru/070-bio-age/docker-compose.yml up -d
services:
  botfarm-ru-bio-age:
    build:
      context: ../../..
      dockerfile: bots/ru/070-bio-age/Dockerfile
    container_name: botfarm-ru-bio-age
    restart: unless-stopped
    env_file: .env
    ports:
      - "9069:9069"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
