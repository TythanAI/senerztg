# Build from the botfarm root:  docker compose -f bots/ru/419-telegram-premium/docker-compose.yml up -d
services:
  botfarm-ru-419-telegram-premium:
    build:
      context: ../../..
      dockerfile: bots/ru/419-telegram-premium/Dockerfile
    container_name: botfarm-ru-419-telegram-premium
    restart: unless-stopped
    env_file: .env
    ports:
      - "9418:9418"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
