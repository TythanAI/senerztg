# Build from the botfarm root:  docker compose -f bots/ru/313-pinterest/docker-compose.yml up -d
services:
  botfarm-ru-313-pinterest:
    build:
      context: ../../..
      dockerfile: bots/ru/313-pinterest/Dockerfile
    container_name: botfarm-ru-313-pinterest
    restart: unless-stopped
    env_file: .env
    ports:
      - "9312:9312"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
