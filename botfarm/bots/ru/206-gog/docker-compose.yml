# Build from the botfarm root:  docker compose -f bots/ru/206-gog/docker-compose.yml up -d
services:
  botfarm-ru-206-gog:
    build:
      context: ../../..
      dockerfile: bots/ru/206-gog/Dockerfile
    container_name: botfarm-ru-206-gog
    restart: unless-stopped
    env_file: .env
    ports:
      - "9205:9205"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
