# Build from the botfarm root:  docker compose -f bots/ru/349-slack/docker-compose.yml up -d
services:
  botfarm-ru-349-slack:
    build:
      context: ../../..
      dockerfile: bots/ru/349-slack/Dockerfile
    container_name: botfarm-ru-349-slack
    restart: unless-stopped
    env_file: .env
    ports:
      - "9348:9348"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
