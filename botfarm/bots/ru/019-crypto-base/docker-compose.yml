# Build from the botfarm root:  docker compose -f bots/ru/019-crypto-base/docker-compose.yml up -d
services:
  botfarm-ru-crypto-base:
    build:
      context: ../../..
      dockerfile: bots/ru/019-crypto-base/Dockerfile
    container_name: botfarm-ru-crypto-base
    restart: unless-stopped
    env_file: .env
    ports:
      - "9018:9018"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
