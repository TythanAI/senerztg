# Build from the botfarm root:  docker compose -f bots/ru/449-apex-boost/docker-compose.yml up -d
services:
  botfarm-ru-449-apex-boost:
    build:
      context: ../../..
      dockerfile: bots/ru/449-apex-boost/Dockerfile
    container_name: botfarm-ru-449-apex-boost
    restart: unless-stopped
    env_file: .env
    ports:
      - "9448:9448"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
