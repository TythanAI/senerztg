# Build from the botfarm root:  docker compose -f bots/ru/330-mailru/docker-compose.yml up -d
services:
  botfarm-ru-330-mailru:
    build:
      context: ../../..
      dockerfile: bots/ru/330-mailru/Dockerfile
    container_name: botfarm-ru-330-mailru
    restart: unless-stopped
    env_file: .env
    ports:
      - "9329:9329"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
