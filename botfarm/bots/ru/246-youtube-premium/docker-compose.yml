# Build from the botfarm root:  docker compose -f bots/ru/246-youtube-premium/docker-compose.yml up -d
services:
  botfarm-ru-246-youtube-premium:
    build:
      context: ../../..
      dockerfile: bots/ru/246-youtube-premium/Dockerfile
    container_name: botfarm-ru-246-youtube-premium
    restart: unless-stopped
    env_file: .env
    ports:
      - "9245:9245"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
