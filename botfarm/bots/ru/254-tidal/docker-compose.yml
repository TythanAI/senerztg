# Build from the botfarm root:  docker compose -f bots/ru/254-tidal/docker-compose.yml up -d
services:
  botfarm-ru-254-tidal:
    build:
      context: ../../..
      dockerfile: bots/ru/254-tidal/Dockerfile
    container_name: botfarm-ru-254-tidal
    restart: unless-stopped
    env_file: .env
    ports:
      - "9253:9253"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
