# Build from the botfarm root:  docker compose -f bots/ru/365-protonvpn/docker-compose.yml up -d
services:
  botfarm-ru-365-protonvpn:
    build:
      context: ../../..
      dockerfile: bots/ru/365-protonvpn/Dockerfile
    container_name: botfarm-ru-365-protonvpn
    restart: unless-stopped
    env_file: .env
    ports:
      - "9364:9364"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
