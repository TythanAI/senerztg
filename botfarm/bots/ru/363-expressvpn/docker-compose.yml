# Build from the botfarm root:  docker compose -f bots/ru/363-expressvpn/docker-compose.yml up -d
services:
  botfarm-ru-363-expressvpn:
    build:
      context: ../../..
      dockerfile: bots/ru/363-expressvpn/Dockerfile
    container_name: botfarm-ru-363-expressvpn
    restart: unless-stopped
    env_file: .env
    ports:
      - "9362:9362"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
