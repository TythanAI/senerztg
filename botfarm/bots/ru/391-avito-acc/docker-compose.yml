# Build from the botfarm root:  docker compose -f bots/ru/391-avito-acc/docker-compose.yml up -d
services:
  botfarm-ru-391-avito-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/391-avito-acc/Dockerfile
    container_name: botfarm-ru-391-avito-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9390:9390"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
