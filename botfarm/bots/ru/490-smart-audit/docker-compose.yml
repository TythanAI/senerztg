# Build from the botfarm root:  docker compose -f bots/ru/490-smart-audit/docker-compose.yml up -d
services:
  botfarm-ru-490-smart-audit:
    build:
      context: ../../..
      dockerfile: bots/ru/490-smart-audit/Dockerfile
    container_name: botfarm-ru-490-smart-audit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9489:9489"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
