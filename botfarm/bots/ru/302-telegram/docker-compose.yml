# Build from the botfarm root:  docker compose -f bots/ru/302-telegram/docker-compose.yml up -d
services:
  botfarm-ru-302-telegram:
    build:
      context: ../../..
      dockerfile: bots/ru/302-telegram/Dockerfile
    container_name: botfarm-ru-302-telegram
    restart: unless-stopped
    env_file: .env
    ports:
      - "9301:9301"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
