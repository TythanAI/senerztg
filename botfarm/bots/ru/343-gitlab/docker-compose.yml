# Build from the botfarm root:  docker compose -f bots/ru/343-gitlab/docker-compose.yml up -d
services:
  botfarm-ru-343-gitlab:
    build:
      context: ../../..
      dockerfile: bots/ru/343-gitlab/Dockerfile
    container_name: botfarm-ru-343-gitlab
    restart: unless-stopped
    env_file: .env
    ports:
      - "9342:9342"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
