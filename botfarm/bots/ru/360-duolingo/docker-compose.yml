# Build from the botfarm root:  docker compose -f bots/ru/360-duolingo/docker-compose.yml up -d
services:
  botfarm-ru-360-duolingo:
    build:
      context: ../../..
      dockerfile: bots/ru/360-duolingo/Dockerfile
    container_name: botfarm-ru-360-duolingo
    restart: unless-stopped
    env_file: .env
    ports:
      - "9359:9359"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
