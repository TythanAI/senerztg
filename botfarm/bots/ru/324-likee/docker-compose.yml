# Build from the botfarm root:  docker compose -f bots/ru/324-likee/docker-compose.yml up -d
services:
  botfarm-ru-324-likee:
    build:
      context: ../../..
      dockerfile: bots/ru/324-likee/Dockerfile
    container_name: botfarm-ru-324-likee
    restart: unless-stopped
    env_file: .env
    ports:
      - "9323:9323"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
