# Build from the botfarm root:  docker compose -f bots/ru/414-windows-key/docker-compose.yml up -d
services:
  botfarm-ru-414-windows-key:
    build:
      context: ../../..
      dockerfile: bots/ru/414-windows-key/Dockerfile
    container_name: botfarm-ru-414-windows-key
    restart: unless-stopped
    env_file: .env
    ports:
      - "9413:9413"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
