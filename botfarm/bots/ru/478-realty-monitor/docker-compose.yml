# Build from the botfarm root:  docker compose -f bots/ru/478-realty-monitor/docker-compose.yml up -d
services:
  botfarm-ru-478-realty-monitor:
    build:
      context: ../../..
      dockerfile: bots/ru/478-realty-monitor/Dockerfile
    container_name: botfarm-ru-478-realty-monitor
    restart: unless-stopped
    env_file: .env
    ports:
      - "9477:9477"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
