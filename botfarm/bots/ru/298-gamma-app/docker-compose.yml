# Build from the botfarm root:  docker compose -f bots/ru/298-gamma-app/docker-compose.yml up -d
services:
  botfarm-ru-298-gamma-app:
    build:
      context: ../../..
      dockerfile: bots/ru/298-gamma-app/Dockerfile
    container_name: botfarm-ru-298-gamma-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "9297:9297"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
