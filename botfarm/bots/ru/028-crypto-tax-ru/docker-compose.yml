# Build from the botfarm root:  docker compose -f bots/ru/028-crypto-tax-ru/docker-compose.yml up -d
services:
  botfarm-ru-028-crypto-tax-ru:
    build:
      context: ../../..
      dockerfile: bots/ru/028-crypto-tax-ru/Dockerfile
    container_name: botfarm-ru-028-crypto-tax-ru
    restart: unless-stopped
    env_file: .env
    ports:
      - "9027:9027"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
