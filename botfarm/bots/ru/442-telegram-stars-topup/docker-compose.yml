# Build from the botfarm root:  docker compose -f bots/ru/442-telegram-stars-topup/docker-compose.yml up -d
services:
  botfarm-ru-442-telegram-stars-topup:
    build:
      context: ../../..
      dockerfile: bots/ru/442-telegram-stars-topup/Dockerfile
    container_name: botfarm-ru-442-telegram-stars-topup
    restart: unless-stopped
    env_file: .env
    ports:
      - "9441:9441"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
