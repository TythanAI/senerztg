# Build from the botfarm root:  docker compose -f bots/ru/155-car-select/docker-compose.yml up -d
services:
  botfarm-ru-155-car-select:
    build:
      context: ../../..
      dockerfile: bots/ru/155-car-select/Dockerfile
    container_name: botfarm-ru-155-car-select
    restart: unless-stopped
    env_file: .env
    ports:
      - "9154:9154"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
