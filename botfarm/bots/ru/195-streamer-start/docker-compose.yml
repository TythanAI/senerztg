# Build from the botfarm root:  docker compose -f bots/ru/195-streamer-start/docker-compose.yml up -d
services:
  botfarm-ru-195-streamer-start:
    build:
      context: ../../..
      dockerfile: bots/ru/195-streamer-start/Dockerfile
    container_name: botfarm-ru-195-streamer-start
    restart: unless-stopped
    env_file: .env
    ports:
      - "9194:9194"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
