# Build from the botfarm root:  docker compose -f bots/ru/429-brawl-gems/docker-compose.yml up -d
services:
  botfarm-ru-429-brawl-gems:
    build:
      context: ../../..
      dockerfile: bots/ru/429-brawl-gems/Dockerfile
    container_name: botfarm-ru-429-brawl-gems
    restart: unless-stopped
    env_file: .env
    ports:
      - "9428:9428"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
