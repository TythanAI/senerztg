# Build from the botfarm root:  docker compose -f bots/ru/123-window-fit/docker-compose.yml up -d
services:
  botfarm-ru-123-window-fit:
    build:
      context: ../../..
      dockerfile: bots/ru/123-window-fit/Dockerfile
    container_name: botfarm-ru-123-window-fit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9122:9122"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
