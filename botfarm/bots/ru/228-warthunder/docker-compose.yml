# Build from the botfarm root:  docker compose -f bots/ru/228-warthunder/docker-compose.yml up -d
services:
  botfarm-ru-228-warthunder:
    build:
      context: ../../..
      dockerfile: bots/ru/228-warthunder/Dockerfile
    container_name: botfarm-ru-228-warthunder
    restart: unless-stopped
    env_file: .env
    ports:
      - "9227:9227"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
