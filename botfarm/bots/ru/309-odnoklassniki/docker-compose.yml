# Build from the botfarm root:  docker compose -f bots/ru/309-odnoklassniki/docker-compose.yml up -d
services:
  botfarm-ru-309-odnoklassniki:
    build:
      context: ../../..
      dockerfile: bots/ru/309-odnoklassniki/Dockerfile
    container_name: botfarm-ru-309-odnoklassniki
    restart: unless-stopped
    env_file: .env
    ports:
      - "9308:9308"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
