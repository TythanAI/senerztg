# Build from the botfarm root:  docker compose -f bots/ru/078-spa-home/docker-compose.yml up -d
services:
  botfarm-ru-spa-home:
    build:
      context: ../../..
      dockerfile: bots/ru/078-spa-home/Dockerfile
    container_name: botfarm-ru-spa-home
    restart: unless-stopped
    env_file: .env
    ports:
      - "9077:9077"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
