# Build from the botfarm root:  docker compose -f bots/ru/013-forex-academy/docker-compose.yml up -d
services:
  botfarm-ru-013-forex-academy:
    build:
      context: ../../..
      dockerfile: bots/ru/013-forex-academy/Dockerfile
    container_name: botfarm-ru-013-forex-academy
    restart: unless-stopped
    env_file: .env
    ports:
      - "9012:9012"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
