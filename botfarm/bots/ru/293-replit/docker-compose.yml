# Build from the botfarm root:  docker compose -f bots/ru/293-replit/docker-compose.yml up -d
services:
  botfarm-ru-293-replit:
    build:
      context: ../../..
      dockerfile: bots/ru/293-replit/Dockerfile
    container_name: botfarm-ru-293-replit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9292:9292"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
