# Build from the botfarm root:  docker compose -f bots/ru/231-apex/docker-compose.yml up -d
services:
  botfarm-ru-231-apex:
    build:
      context: ../../..
      dockerfile: bots/ru/231-apex/Dockerfile
    container_name: botfarm-ru-231-apex
    restart: unless-stopped
    env_file: .env
    ports:
      - "9230:9230"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
