# Build from the botfarm root:  docker compose -f bots/ru/342-github/docker-compose.yml up -d
services:
  botfarm-ru-342-github:
    build:
      context: ../../..
      dockerfile: bots/ru/342-github/Dockerfile
    container_name: botfarm-ru-342-github
    restart: unless-stopped
    env_file: .env
    ports:
      - "9341:9341"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
