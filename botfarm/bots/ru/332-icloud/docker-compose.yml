# Build from the botfarm root:  docker compose -f bots/ru/332-icloud/docker-compose.yml up -d
services:
  botfarm-ru-332-icloud:
    build:
      context: ../../..
      dockerfile: bots/ru/332-icloud/Dockerfile
    container_name: botfarm-ru-332-icloud
    restart: unless-stopped
    env_file: .env
    ports:
      - "9331:9331"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
