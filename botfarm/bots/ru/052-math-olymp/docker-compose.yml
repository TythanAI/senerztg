# Build from the botfarm root:  docker compose -f bots/ru/052-math-olymp/docker-compose.yml up -d
services:
  botfarm-ru-math-olymp:
    build:
      context: ../../..
      dockerfile: bots/ru/052-math-olymp/Dockerfile
    container_name: botfarm-ru-math-olymp
    restart: unless-stopped
    env_file: .env
    ports:
      - "9051:9051"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
