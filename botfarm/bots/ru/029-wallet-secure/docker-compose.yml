# Build from the botfarm root:  docker compose -f bots/ru/029-wallet-secure/docker-compose.yml up -d
services:
  botfarm-ru-wallet-secure:
    build:
      context: ../../..
      dockerfile: bots/ru/029-wallet-secure/Dockerfile
    container_name: botfarm-ru-wallet-secure
    restart: unless-stopped
    env_file: .env
    ports:
      - "9028:9028"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
