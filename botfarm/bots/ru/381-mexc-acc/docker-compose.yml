# Build from the botfarm root:  docker compose -f bots/ru/381-mexc-acc/docker-compose.yml up -d
services:
  botfarm-ru-381-mexc-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/381-mexc-acc/Dockerfile
    container_name: botfarm-ru-381-mexc-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9380:9380"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
