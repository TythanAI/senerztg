# Build from the botfarm root:  docker compose -f bots/ru/021-nft-drop/docker-compose.yml up -d
services:
  botfarm-ru-nft-drop:
    build:
      context: ../../..
      dockerfile: bots/ru/021-nft-drop/Dockerfile
    container_name: botfarm-ru-nft-drop
    restart: unless-stopped
    env_file: .env
    ports:
      - "9020:9020"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
