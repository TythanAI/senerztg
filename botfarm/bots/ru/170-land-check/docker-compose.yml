# Build from the botfarm root:  docker compose -f bots/ru/170-land-check/docker-compose.yml up -d
services:
  botfarm-ru-land-check:
    build:
      context: ../../..
      dockerfile: bots/ru/170-land-check/Dockerfile
    container_name: botfarm-ru-land-check
    restart: unless-stopped
    env_file: .env
    ports:
      - "9169:9169"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
