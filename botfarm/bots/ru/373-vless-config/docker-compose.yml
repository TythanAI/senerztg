# Build from the botfarm root:  docker compose -f bots/ru/373-vless-config/docker-compose.yml up -d
services:
  botfarm-ru-373-vless-config:
    build:
      context: ../../..
      dockerfile: bots/ru/373-vless-config/Dockerfile
    container_name: botfarm-ru-373-vless-config
    restart: unless-stopped
    env_file: .env
    ports:
      - "9372:9372"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
