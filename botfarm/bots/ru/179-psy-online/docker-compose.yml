# Build from the botfarm root:  docker compose -f bots/ru/179-psy-online/docker-compose.yml up -d
services:
  botfarm-ru-179-psy-online:
    build:
      context: ../../..
      dockerfile: bots/ru/179-psy-online/Dockerfile
    container_name: botfarm-ru-179-psy-online
    restart: unless-stopped
    env_file: .env
    ports:
      - "9178:9178"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
