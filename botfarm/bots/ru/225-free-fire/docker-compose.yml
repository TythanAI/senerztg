# Build from the botfarm root:  docker compose -f bots/ru/225-free-fire/docker-compose.yml up -d
services:
  botfarm-ru-225-free-fire:
    build:
      context: ../../..
      dockerfile: bots/ru/225-free-fire/Dockerfile
    container_name: botfarm-ru-225-free-fire
    restart: unless-stopped
    env_file: .env
    ports:
      - "9224:9224"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
