# Build from the botfarm root:  docker compose -f bots/ru/288-jasper/docker-compose.yml up -d
services:
  botfarm-ru-288-jasper:
    build:
      context: ../../..
      dockerfile: bots/ru/288-jasper/Dockerfile
    container_name: botfarm-ru-288-jasper
    restart: unless-stopped
    env_file: .env
    ports:
      - "9287:9287"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
