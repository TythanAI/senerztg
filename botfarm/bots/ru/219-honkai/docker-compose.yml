# Build from the botfarm root:  docker compose -f bots/ru/219-honkai/docker-compose.yml up -d
services:
  botfarm-ru-219-honkai:
    build:
      context: ../../..
      dockerfile: bots/ru/219-honkai/Dockerfile
    container_name: botfarm-ru-219-honkai
    restart: unless-stopped
    env_file: .env
    ports:
      - "9218:9218"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
