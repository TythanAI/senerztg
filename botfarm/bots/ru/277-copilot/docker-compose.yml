# Build from the botfarm root:  docker compose -f bots/ru/277-copilot/docker-compose.yml up -d
services:
  botfarm-ru-277-copilot:
    build:
      context: ../../..
      dockerfile: bots/ru/277-copilot/Dockerfile
    container_name: botfarm-ru-277-copilot
    restart: unless-stopped
    env_file: .env
    ports:
      - "9276:9276"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
