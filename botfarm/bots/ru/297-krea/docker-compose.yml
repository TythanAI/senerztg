# Build from the botfarm root:  docker compose -f bots/ru/297-krea/docker-compose.yml up -d
services:
  botfarm-ru-297-krea:
    build:
      context: ../../..
      dockerfile: bots/ru/297-krea/Dockerfile
    container_name: botfarm-ru-297-krea
    restart: unless-stopped
    env_file: .env
    ports:
      - "9296:9296"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
