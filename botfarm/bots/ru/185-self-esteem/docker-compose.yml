# Build from the botfarm root:  docker compose -f bots/ru/185-self-esteem/docker-compose.yml up -d
services:
  botfarm-ru-self-esteem:
    build:
      context: ../../..
      dockerfile: bots/ru/185-self-esteem/Dockerfile
    container_name: botfarm-ru-self-esteem
    restart: unless-stopped
    env_file: .env
    ports:
      - "9184:9184"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
