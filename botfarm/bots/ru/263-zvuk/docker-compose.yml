# Build from the botfarm root:  docker compose -f bots/ru/263-zvuk/docker-compose.yml up -d
services:
  botfarm-ru-263-zvuk:
    build:
      context: ../../..
      dockerfile: bots/ru/263-zvuk/Dockerfile
    container_name: botfarm-ru-263-zvuk
    restart: unless-stopped
    env_file: .env
    ports:
      - "9262:9262"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
