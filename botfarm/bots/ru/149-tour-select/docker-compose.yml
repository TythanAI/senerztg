# Build from the botfarm root:  docker compose -f bots/ru/149-tour-select/docker-compose.yml up -d
services:
  botfarm-ru-149-tour-select:
    build:
      context: ../../..
      dockerfile: bots/ru/149-tour-select/Dockerfile
    container_name: botfarm-ru-149-tour-select
    restart: unless-stopped
    env_file: .env
    ports:
      - "9148:9148"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
