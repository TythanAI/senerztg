# Build from the botfarm root:  docker compose -f bots/ru/480-crypto-exchange/docker-compose.yml up -d
services:
  botfarm-ru-480-crypto-exchange:
    build:
      context: ../../..
      dockerfile: bots/ru/480-crypto-exchange/Dockerfile
    container_name: botfarm-ru-480-crypto-exchange
    restart: unless-stopped
    env_file: .env
    ports:
      - "9479:9479"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
