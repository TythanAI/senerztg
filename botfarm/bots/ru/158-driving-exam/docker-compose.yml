# Build from the botfarm root:  docker compose -f bots/ru/158-driving-exam/docker-compose.yml up -d
services:
  botfarm-ru-158-driving-exam:
    build:
      context: ../../..
      dockerfile: bots/ru/158-driving-exam/Dockerfile
    container_name: botfarm-ru-158-driving-exam
    restart: unless-stopped
    env_file: .env
    ports:
      - "9157:9157"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
