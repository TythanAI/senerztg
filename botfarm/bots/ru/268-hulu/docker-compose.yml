# Build from the botfarm root:  docker compose -f bots/ru/268-hulu/docker-compose.yml up -d
services:
  botfarm-ru-268-hulu:
    build:
      context: ../../..
      dockerfile: bots/ru/268-hulu/Dockerfile
    container_name: botfarm-ru-268-hulu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9267:9267"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
