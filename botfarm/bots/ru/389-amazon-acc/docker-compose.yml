# Build from the botfarm root:  docker compose -f bots/ru/389-amazon-acc/docker-compose.yml up -d
services:
  botfarm-ru-389-amazon-acc:
    build:
      context: ../../..
      dockerfile: bots/ru/389-amazon-acc/Dockerfile
    container_name: botfarm-ru-389-amazon-acc
    restart: unless-stopped
    env_file: .env
    ports:
      - "9388:9388"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
