# Build from the botfarm root:  docker compose -f bots/ru/276-gemini-advanced/docker-compose.yml up -d
services:
  botfarm-ru-276-gemini-advanced:
    build:
      context: ../../..
      dockerfile: bots/ru/276-gemini-advanced/Dockerfile
    container_name: botfarm-ru-276-gemini-advanced
    restart: unless-stopped
    env_file: .env
    ports:
      - "9275:9275"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
