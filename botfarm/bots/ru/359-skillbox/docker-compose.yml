# Build from the botfarm root:  docker compose -f bots/ru/359-skillbox/docker-compose.yml up -d
services:
  botfarm-ru-359-skillbox:
    build:
      context: ../../..
      dockerfile: bots/ru/359-skillbox/Dockerfile
    container_name: botfarm-ru-359-skillbox
    restart: unless-stopped
    env_file: .env
    ports:
      - "9358:9358"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
