# Build from the botfarm root:  docker compose -f bots/ru/154-city-guides/docker-compose.yml up -d
services:
  botfarm-ru-city-guides:
    build:
      context: ../../..
      dockerfile: bots/ru/154-city-guides/Dockerfile
    container_name: botfarm-ru-city-guides
    restart: unless-stopped
    env_file: .env
    ports:
      - "9153:9153"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
