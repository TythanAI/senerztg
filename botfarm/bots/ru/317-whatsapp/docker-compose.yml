# Build from the botfarm root:  docker compose -f bots/ru/317-whatsapp/docker-compose.yml up -d
services:
  botfarm-ru-317-whatsapp:
    build:
      context: ../../..
      dockerfile: bots/ru/317-whatsapp/Dockerfile
    container_name: botfarm-ru-317-whatsapp
    restart: unless-stopped
    env_file: .env
    ports:
      - "9316:9316"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
