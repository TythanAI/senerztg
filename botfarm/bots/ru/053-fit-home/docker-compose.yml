# Build from the botfarm root:  docker compose -f bots/ru/053-fit-home/docker-compose.yml up -d
services:
  botfarm-ru-053-fit-home:
    build:
      context: ../../..
      dockerfile: bots/ru/053-fit-home/Dockerfile
    container_name: botfarm-ru-053-fit-home
    restart: unless-stopped
    env_file: .env
    ports:
      - "9052:9052"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
