# Build from the botfarm root:  docker compose -f bots/ru/329-yandex-mail/docker-compose.yml up -d
services:
  botfarm-ru-329-yandex-mail:
    build:
      context: ../../..
      dockerfile: bots/ru/329-yandex-mail/Dockerfile
    container_name: botfarm-ru-329-yandex-mail
    restart: unless-stopped
    env_file: .env
    ports:
      - "9328:9328"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
