# Build from the botfarm root:  docker compose -f bots/ru/249-apple-music/docker-compose.yml up -d
services:
  botfarm-ru-249-apple-music:
    build:
      context: ../../..
      dockerfile: bots/ru/249-apple-music/Dockerfile
    container_name: botfarm-ru-249-apple-music
    restart: unless-stopped
    env_file: .env
    ports:
      - "9248:9248"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
