# Build from the botfarm root:  docker compose -f bots/ru/289-copy-ai/docker-compose.yml up -d
services:
  botfarm-ru-289-copy-ai:
    build:
      context: ../../..
      dockerfile: bots/ru/289-copy-ai/Dockerfile
    container_name: botfarm-ru-289-copy-ai
    restart: unless-stopped
    env_file: .env
    ports:
      - "9288:9288"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
