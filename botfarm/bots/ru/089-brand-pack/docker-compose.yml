# Build from the botfarm root:  docker compose -f bots/ru/089-brand-pack/docker-compose.yml up -d
services:
  botfarm-ru-brand-pack:
    build:
      context: ../../..
      dockerfile: bots/ru/089-brand-pack/Dockerfile
    container_name: botfarm-ru-brand-pack
    restart: unless-stopped
    env_file: .env
    ports:
      - "9088:9088"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
