# Build from the botfarm root:  docker compose -f bots/ru/275-perplexity/docker-compose.yml up -d
services:
  botfarm-ru-275-perplexity:
    build:
      context: ../../..
      dockerfile: bots/ru/275-perplexity/Dockerfile
    container_name: botfarm-ru-275-perplexity
    restart: unless-stopped
    env_file: .env
    ports:
      - "9274:9274"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
