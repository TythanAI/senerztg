# Build from the botfarm root:  docker compose -f bots/ru/242-xbox/docker-compose.yml up -d
services:
  botfarm-ru-242-xbox:
    build:
      context: ../../..
      dockerfile: bots/ru/242-xbox/Dockerfile
    container_name: botfarm-ru-242-xbox
    restart: unless-stopped
    env_file: .env
    ports:
      - "9241:9241"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
