# Build from the botfarm root:  docker compose -f bots/ru/431-free-fire-diamonds/docker-compose.yml up -d
services:
  botfarm-ru-431-free-fire-diamonds:
    build:
      context: ../../..
      dockerfile: bots/ru/431-free-fire-diamonds/Dockerfile
    container_name: botfarm-ru-431-free-fire-diamonds
    restart: unless-stopped
    env_file: .env
    ports:
      - "9430:9430"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
