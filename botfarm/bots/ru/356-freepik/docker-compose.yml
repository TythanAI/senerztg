# Build from the botfarm root:  docker compose -f bots/ru/356-freepik/docker-compose.yml up -d
services:
  botfarm-ru-356-freepik:
    build:
      context: ../../..
      dockerfile: bots/ru/356-freepik/Dockerfile
    container_name: botfarm-ru-356-freepik
    restart: unless-stopped
    env_file: .env
    ports:
      - "9355:9355"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
