# Build from the botfarm root:  docker compose -f bots/ru/435-lol-rp/docker-compose.yml up -d
services:
  botfarm-ru-435-lol-rp:
    build:
      context: ../../..
      dockerfile: bots/ru/435-lol-rp/Dockerfile
    container_name: botfarm-ru-435-lol-rp
    restart: unless-stopped
    env_file: .env
    ports:
      - "9434:9434"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
