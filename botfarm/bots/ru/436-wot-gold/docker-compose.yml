# Build from the botfarm root:  docker compose -f bots/ru/436-wot-gold/docker-compose.yml up -d
services:
  botfarm-ru-436-wot-gold:
    build:
      context: ../../..
      dockerfile: bots/ru/436-wot-gold/Dockerfile
    container_name: botfarm-ru-436-wot-gold
    restart: unless-stopped
    env_file: .env
    ports:
      - "9435:9435"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
