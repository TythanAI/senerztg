# Build from the botfarm root:  docker compose -f bots/ru/274-midjourney/docker-compose.yml up -d
services:
  botfarm-ru-274-midjourney:
    build:
      context: ../../..
      dockerfile: bots/ru/274-midjourney/Dockerfile
    container_name: botfarm-ru-274-midjourney
    restart: unless-stopped
    env_file: .env
    ports:
      - "9273:9273"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
