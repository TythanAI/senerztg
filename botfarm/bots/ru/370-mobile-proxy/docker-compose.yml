# Build from the botfarm root:  docker compose -f bots/ru/370-mobile-proxy/docker-compose.yml up -d
services:
  botfarm-ru-370-mobile-proxy:
    build:
      context: ../../..
      dockerfile: bots/ru/370-mobile-proxy/Dockerfile
    container_name: botfarm-ru-370-mobile-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "9369:9369"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
