# Build from the botfarm root:  docker compose -f bots/ru/340-tutanota/docker-compose.yml up -d
services:
  botfarm-ru-340-tutanota:
    build:
      context: ../../..
      dockerfile: bots/ru/340-tutanota/Dockerfile
    container_name: botfarm-ru-340-tutanota
    restart: unless-stopped
    env_file: .env
    ports:
      - "9339:9339"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
