# Build from the botfarm root:  docker compose -f bots/ru/073-hair-care/docker-compose.yml up -d
services:
  botfarm-ru-hair-care:
    build:
      context: ../../..
      dockerfile: bots/ru/073-hair-care/Dockerfile
    container_name: botfarm-ru-hair-care
    restart: unless-stopped
    env_file: .env
    ports:
      - "9072:9072"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
