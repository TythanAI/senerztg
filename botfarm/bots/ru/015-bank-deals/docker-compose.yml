# Build from the botfarm root:  docker compose -f bots/ru/015-bank-deals/docker-compose.yml up -d
services:
  botfarm-ru-015-bank-deals:
    build:
      context: ../../..
      dockerfile: bots/ru/015-bank-deals/Dockerfile
    container_name: botfarm-ru-015-bank-deals
    restart: unless-stopped
    env_file: .env
    ports:
      - "9014:9014"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
