# Build from the botfarm root:  docker compose -f bots/ru/064-detox-week/docker-compose.yml up -d
services:
  botfarm-ru-detox-week:
    build:
      context: ../../..
      dockerfile: bots/ru/064-detox-week/Dockerfile
    container_name: botfarm-ru-detox-week
    restart: unless-stopped
    env_file: .env
    ports:
      - "9063:9063"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
