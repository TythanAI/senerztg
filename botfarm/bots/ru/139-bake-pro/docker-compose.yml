# Build from the botfarm root:  docker compose -f bots/ru/139-bake-pro/docker-compose.yml up -d
services:
  botfarm-ru-139-bake-pro:
    build:
      context: ../../..
      dockerfile: bots/ru/139-bake-pro/Dockerfile
    container_name: botfarm-ru-139-bake-pro
    restart: unless-stopped
    env_file: .env
    ports:
      - "9138:9138"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
