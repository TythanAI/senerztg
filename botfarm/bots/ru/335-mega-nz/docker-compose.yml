# Build from the botfarm root:  docker compose -f bots/ru/335-mega-nz/docker-compose.yml up -d
services:
  botfarm-ru-335-mega-nz:
    build:
      context: ../../..
      dockerfile: bots/ru/335-mega-nz/Dockerfile
    container_name: botfarm-ru-335-mega-nz
    restart: unless-stopped
    env_file: .env
    ports:
      - "9334:9334"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
