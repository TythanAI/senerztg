# Build from the botfarm root:  docker compose -f bots/ru/369-http-proxy/docker-compose.yml up -d
services:
  botfarm-ru-369-http-proxy:
    build:
      context: ../../..
      dockerfile: bots/ru/369-http-proxy/Dockerfile
    container_name: botfarm-ru-369-http-proxy
    restart: unless-stopped
    env_file: .env
    ports:
      - "9368:9368"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
