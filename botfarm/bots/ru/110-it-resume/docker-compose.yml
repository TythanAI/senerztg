# Build from the botfarm root:  docker compose -f bots/ru/110-it-resume/docker-compose.yml up -d
services:
  botfarm-ru-it-resume:
    build:
      context: ../../..
      dockerfile: bots/ru/110-it-resume/Dockerfile
    container_name: botfarm-ru-it-resume
    restart: unless-stopped
    env_file: .env
    ports:
      - "9109:9109"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
