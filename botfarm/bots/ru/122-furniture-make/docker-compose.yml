# Build from the botfarm root:  docker compose -f bots/ru/122-furniture-make/docker-compose.yml up -d
services:
  botfarm-ru-furniture-make:
    build:
      context: ../../..
      dockerfile: bots/ru/122-furniture-make/Dockerfile
    container_name: botfarm-ru-furniture-make
    restart: unless-stopped
    env_file: .env
    ports:
      - "9121:9121"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
