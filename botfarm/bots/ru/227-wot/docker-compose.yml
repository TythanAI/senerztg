# Build from the botfarm root:  docker compose -f bots/ru/227-wot/docker-compose.yml up -d
services:
  botfarm-ru-227-wot:
    build:
      context: ../../..
      dockerfile: bots/ru/227-wot/Dockerfile
    container_name: botfarm-ru-227-wot
    restart: unless-stopped
    env_file: .env
    ports:
      - "9226:9226"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
