# Build from the botfarm root:  docker compose -f bots/ru/117-repair-flat/docker-compose.yml up -d
services:
  botfarm-ru-117-repair-flat:
    build:
      context: ../../..
      dockerfile: bots/ru/117-repair-flat/Dockerfile
    container_name: botfarm-ru-117-repair-flat
    restart: unless-stopped
    env_file: .env
    ports:
      - "9116:9116"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
