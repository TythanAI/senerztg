# Build from the botfarm root:  docker compose -f bots/ru/044-uni-abroad/docker-compose.yml up -d
services:
  botfarm-ru-044-uni-abroad:
    build:
      context: ../../..
      dockerfile: bots/ru/044-uni-abroad/Dockerfile
    container_name: botfarm-ru-044-uni-abroad
    restart: unless-stopped
    env_file: .env
    ports:
      - "9043:9043"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
