# Build from the botfarm root:  docker compose -f bots/ru/038-ege-russian/docker-compose.yml up -d
services:
  botfarm-ru-ege-russian:
    build:
      context: ../../..
      dockerfile: bots/ru/038-ege-russian/Dockerfile
    container_name: botfarm-ru-ege-russian
    restart: unless-stopped
    env_file: .env
    ports:
      - "9037:9037"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
