# Build from the botfarm root:  docker compose -f bots/ru/046-teacher-tools/docker-compose.yml up -d
services:
  botfarm-ru-046-teacher-tools:
    build:
      context: ../../..
      dockerfile: bots/ru/046-teacher-tools/Dockerfile
    container_name: botfarm-ru-046-teacher-tools
    restart: unless-stopped
    env_file: .env
    ports:
      - "9045:9045"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
