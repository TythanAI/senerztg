# Build from the botfarm root:  docker compose -f bots/ru/344-jetbrains/docker-compose.yml up -d
services:
  botfarm-ru-344-jetbrains:
    build:
      context: ../../..
      dockerfile: bots/ru/344-jetbrains/Dockerfile
    container_name: botfarm-ru-344-jetbrains
    restart: unless-stopped
    env_file: .env
    ports:
      - "9343:9343"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
