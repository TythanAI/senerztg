# Build from the botfarm root:  docker compose -f bots/ru/416-antivirus-key/docker-compose.yml up -d
services:
  botfarm-ru-416-antivirus-key:
    build:
      context: ../../..
      dockerfile: bots/ru/416-antivirus-key/Dockerfile
    container_name: botfarm-ru-416-antivirus-key
    restart: unless-stopped
    env_file: .env
    ports:
      - "9415:9415"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
