# Build from the botfarm root:  docker compose -f bots/eu/033-security-audit/docker-compose.yml up -d
services:
  botfarm-eu-security-audit:
    build:
      context: ../../..
      dockerfile: bots/eu/033-security-audit/Dockerfile
    container_name: botfarm-eu-security-audit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9232:9232"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
