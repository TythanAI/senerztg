# Build from the botfarm root:  docker compose -f bots/eu/010-swing-trader/docker-compose.yml up -d
services:
  botfarm-eu-010-swing-trader:
    build:
      context: ../../..
      dockerfile: bots/eu/010-swing-trader/Dockerfile
    container_name: botfarm-eu-010-swing-trader
    restart: unless-stopped
    env_file: .env
    ports:
      - "9509:9509"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
