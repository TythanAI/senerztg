# Build from the botfarm root:  docker compose -f bots/eu/056-remote-jobs/docker-compose.yml up -d
services:
  botfarm-eu-056-remote-jobs:
    build:
      context: ../../..
      dockerfile: bots/eu/056-remote-jobs/Dockerfile
    container_name: botfarm-eu-056-remote-jobs
    restart: unless-stopped
    env_file: .env
    ports:
      - "9555:9555"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
