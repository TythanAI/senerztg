# Build from the botfarm root:  docker compose -f bots/eu/015-onchain-signals/docker-compose.yml up -d
services:
  botfarm-eu-015-onchain-signals:
    build:
      context: ../../..
      dockerfile: bots/eu/015-onchain-signals/Dockerfile
    container_name: botfarm-eu-015-onchain-signals
    restart: unless-stopped
    env_file: .env
    ports:
      - "9514:9514"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
