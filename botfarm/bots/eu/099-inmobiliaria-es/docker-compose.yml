# Build from the botfarm root:  docker compose -f bots/eu/099-inmobiliaria-es/docker-compose.yml up -d
services:
  botfarm-eu-099-inmobiliaria-es:
    build:
      context: ../../..
      dockerfile: bots/eu/099-inmobiliaria-es/Dockerfile
    container_name: botfarm-eu-099-inmobiliaria-es
    restart: unless-stopped
    env_file: .env
    ports:
      - "9598:9598"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
