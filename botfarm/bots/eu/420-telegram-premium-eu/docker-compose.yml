# Build from the botfarm root:  docker compose -f bots/eu/420-telegram-premium-eu/docker-compose.yml up -d
services:
  botfarm-eu-420-telegram-premium-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/420-telegram-premium-eu/Dockerfile
    container_name: botfarm-eu-420-telegram-premium-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9919:9919"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
