# Build from the botfarm root:  docker compose -f bots/eu/193-preply-eu/docker-compose.yml up -d
services:
  botfarm-eu-193-preply-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/193-preply-eu/Dockerfile
    container_name: botfarm-eu-193-preply-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9692:9692"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
