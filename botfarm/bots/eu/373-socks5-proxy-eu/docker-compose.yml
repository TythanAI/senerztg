# Build from the botfarm root:  docker compose -f bots/eu/373-socks5-proxy-eu/docker-compose.yml up -d
services:
  botfarm-eu-373-socks5-proxy-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/373-socks5-proxy-eu/Dockerfile
    container_name: botfarm-eu-373-socks5-proxy-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9872:9872"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
