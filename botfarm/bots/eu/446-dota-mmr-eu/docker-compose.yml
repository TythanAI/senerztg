# Build from the botfarm root:  docker compose -f bots/eu/446-dota-mmr-eu/docker-compose.yml up -d
services:
  botfarm-eu-446-dota-mmr-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/446-dota-mmr-eu/Dockerfile
    container_name: botfarm-eu-446-dota-mmr-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9945:9945"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
