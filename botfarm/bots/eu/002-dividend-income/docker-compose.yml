# Build from the botfarm root:  docker compose -f bots/eu/002-dividend-income/docker-compose.yml up -d
services:
  botfarm-eu-dividend-income:
    build:
      context: ../../..
      dockerfile: bots/eu/002-dividend-income/Dockerfile
    container_name: botfarm-eu-dividend-income
    restart: unless-stopped
    env_file: .env
    ports:
      - "9201:9201"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
