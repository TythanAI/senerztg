# Build from the botfarm root:  docker compose -f bots/eu/092-digital-nomad/docker-compose.yml up -d
services:
  botfarm-eu-092-digital-nomad:
    build:
      context: ../../..
      dockerfile: bots/eu/092-digital-nomad/Dockerfile
    container_name: botfarm-eu-092-digital-nomad
    restart: unless-stopped
    env_file: .env
    ports:
      - "9591:9591"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
