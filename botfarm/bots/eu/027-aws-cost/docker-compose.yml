# Build from the botfarm root:  docker compose -f bots/eu/027-aws-cost/docker-compose.yml up -d
services:
  botfarm-eu-aws-cost:
    build:
      context: ../../..
      dockerfile: bots/eu/027-aws-cost/Dockerfile
    container_name: botfarm-eu-aws-cost
    restart: unless-stopped
    env_file: .env
    ports:
      - "9226:9226"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
