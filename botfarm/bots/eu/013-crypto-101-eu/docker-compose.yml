# Build from the botfarm root:  docker compose -f bots/eu/013-crypto-101-eu/docker-compose.yml up -d
services:
  botfarm-eu-013-crypto-101-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/013-crypto-101-eu/Dockerfile
    container_name: botfarm-eu-013-crypto-101-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9512:9512"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
