# Build from the botfarm root:  docker compose -f bots/eu/023-api-monitor/docker-compose.yml up -d
services:
  botfarm-eu-api-monitor:
    build:
      context: ../../..
      dockerfile: bots/eu/023-api-monitor/Dockerfile
    container_name: botfarm-eu-api-monitor
    restart: unless-stopped
    env_file: .env
    ports:
      - "9222:9222"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
