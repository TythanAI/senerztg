# Build from the botfarm root:  docker compose -f bots/eu/357-trello-eu/docker-compose.yml up -d
services:
  botfarm-eu-357-trello-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/357-trello-eu/Dockerfile
    container_name: botfarm-eu-357-trello-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9856:9856"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
