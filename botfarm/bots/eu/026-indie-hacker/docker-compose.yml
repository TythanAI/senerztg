# Build from the botfarm root:  docker compose -f bots/eu/026-indie-hacker/docker-compose.yml up -d
services:
  botfarm-eu-indie-hacker:
    build:
      context: ../../..
      dockerfile: bots/eu/026-indie-hacker/Dockerfile
    container_name: botfarm-eu-indie-hacker
    restart: unless-stopped
    env_file: .env
    ports:
      - "9225:9225"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
