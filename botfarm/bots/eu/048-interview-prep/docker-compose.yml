# Build from the botfarm root:  docker compose -f bots/eu/048-interview-prep/docker-compose.yml up -d
services:
  botfarm-eu-interview-prep:
    build:
      context: ../../..
      dockerfile: bots/eu/048-interview-prep/Dockerfile
    container_name: botfarm-eu-interview-prep
    restart: unless-stopped
    env_file: .env
    ports:
      - "9247:9247"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
