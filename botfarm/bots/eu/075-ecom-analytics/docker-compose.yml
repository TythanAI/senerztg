# Build from the botfarm root:  docker compose -f bots/eu/075-ecom-analytics/docker-compose.yml up -d
services:
  botfarm-eu-ecom-analytics:
    build:
      context: ../../..
      dockerfile: bots/eu/075-ecom-analytics/Dockerfile
    container_name: botfarm-eu-ecom-analytics
    restart: unless-stopped
    env_file: .env
    ports:
      - "9274:9274"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
