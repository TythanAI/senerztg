# Build from the botfarm root:  docker compose -f bots/eu/065-amazon-fba/docker-compose.yml up -d
services:
  botfarm-eu-065-amazon-fba:
    build:
      context: ../../..
      dockerfile: bots/eu/065-amazon-fba/Dockerfile
    container_name: botfarm-eu-065-amazon-fba
    restart: unless-stopped
    env_file: .env
    ports:
      - "9564:9564"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
