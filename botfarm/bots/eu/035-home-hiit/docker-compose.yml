# Build from the botfarm root:  docker compose -f bots/eu/035-home-hiit/docker-compose.yml up -d
services:
  botfarm-eu-035-home-hiit:
    build:
      context: ../../..
      dockerfile: bots/eu/035-home-hiit/Dockerfile
    container_name: botfarm-eu-035-home-hiit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9534:9534"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
