# Build from the botfarm root:  docker compose -f bots/eu/076-vat-oss/docker-compose.yml up -d
services:
  botfarm-eu-076-vat-oss:
    build:
      context: ../../..
      dockerfile: bots/eu/076-vat-oss/Dockerfile
    container_name: botfarm-eu-076-vat-oss
    restart: unless-stopped
    env_file: .env
    ports:
      - "9575:9575"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
