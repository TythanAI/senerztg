# Build from the botfarm root:  docker compose -f bots/eu/053-pmp-prep/docker-compose.yml up -d
services:
  botfarm-eu-pmp-prep:
    build:
      context: ../../..
      dockerfile: bots/eu/053-pmp-prep/Dockerfile
    container_name: botfarm-eu-pmp-prep
    restart: unless-stopped
    env_file: .env
    ports:
      - "9252:9252"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
