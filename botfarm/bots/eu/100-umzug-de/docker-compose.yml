# Build from the botfarm root:  docker compose -f bots/eu/100-umzug-de/docker-compose.yml up -d
services:
  botfarm-eu-100-umzug-de:
    build:
      context: ../../..
      dockerfile: bots/eu/100-umzug-de/Dockerfile
    container_name: botfarm-eu-100-umzug-de
    restart: unless-stopped
    env_file: .env
    ports:
      - "9599:9599"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
