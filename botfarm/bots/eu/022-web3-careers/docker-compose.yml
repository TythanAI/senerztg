# Build from the botfarm root:  docker compose -f bots/eu/022-web3-careers/docker-compose.yml up -d
services:
  botfarm-eu-022-web3-careers:
    build:
      context: ../../..
      dockerfile: bots/eu/022-web3-careers/Dockerfile
    container_name: botfarm-eu-022-web3-careers
    restart: unless-stopped
    env_file: .env
    ports:
      - "9521:9521"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
