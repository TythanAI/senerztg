# Build from the botfarm root:  docker compose -f bots/eu/306-grammarly-eu/docker-compose.yml up -d
services:
  botfarm-eu-306-grammarly-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/306-grammarly-eu/Dockerfile
    container_name: botfarm-eu-306-grammarly-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9805:9805"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
