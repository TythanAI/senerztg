# Build from the botfarm root:  docker compose -f bots/eu/063-content-eu/docker-compose.yml up -d
services:
  botfarm-eu-content-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/063-content-eu/Dockerfile
    container_name: botfarm-eu-content-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9262:9262"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
