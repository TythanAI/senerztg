# Build from the botfarm root:  docker compose -f bots/eu/070-marketing-de/docker-compose.yml up -d
services:
  botfarm-eu-marketing-de:
    build:
      context: ../../..
      dockerfile: bots/eu/070-marketing-de/Dockerfile
    container_name: botfarm-eu-marketing-de
    restart: unless-stopped
    env_file: .env
    ports:
      - "9269:9269"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
