# Build from the botfarm root:  docker compose -f bots/eu/088-travel-hack/docker-compose.yml up -d
services:
  botfarm-eu-travel-hack:
    build:
      context: ../../..
      dockerfile: bots/eu/088-travel-hack/Dockerfile
    container_name: botfarm-eu-travel-hack
    restart: unless-stopped
    env_file: .env
    ports:
      - "9287:9287"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
