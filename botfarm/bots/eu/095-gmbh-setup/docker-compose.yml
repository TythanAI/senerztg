# Build from the botfarm root:  docker compose -f bots/eu/095-gmbh-setup/docker-compose.yml up -d
services:
  botfarm-eu-gmbh-setup:
    build:
      context: ../../..
      dockerfile: bots/eu/095-gmbh-setup/Dockerfile
    container_name: botfarm-eu-gmbh-setup
    restart: unless-stopped
    env_file: .env
    ports:
      - "9294:9294"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
