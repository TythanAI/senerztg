# Build from the botfarm root:  docker compose -f bots/eu/036-strength-plan/docker-compose.yml up -d
services:
  botfarm-eu-strength-plan:
    build:
      context: ../../..
      dockerfile: bots/eu/036-strength-plan/Dockerfile
    container_name: botfarm-eu-strength-plan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9235:9235"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
