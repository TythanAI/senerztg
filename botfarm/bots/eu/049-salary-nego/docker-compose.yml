# Build from the botfarm root:  docker compose -f bots/eu/049-salary-nego/docker-compose.yml up -d
services:
  botfarm-eu-salary-nego:
    build:
      context: ../../..
      dockerfile: bots/eu/049-salary-nego/Dockerfile
    container_name: botfarm-eu-salary-nego
    restart: unless-stopped
    env_file: .env
    ports:
      - "9248:9248"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
