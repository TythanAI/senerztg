# Build from the botfarm root:  docker compose -f bots/eu/044-mental-fit/docker-compose.yml up -d
services:
  botfarm-eu-mental-fit:
    build:
      context: ../../..
      dockerfile: bots/eu/044-mental-fit/Dockerfile
    container_name: botfarm-eu-mental-fit
    restart: unless-stopped
    env_file: .env
    ports:
      - "9243:9243"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
