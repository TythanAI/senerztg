# Build from the botfarm root:  docker compose -f bots/eu/018-solidity-dev/docker-compose.yml up -d
services:
  botfarm-eu-018-solidity-dev:
    build:
      context: ../../..
      dockerfile: bots/eu/018-solidity-dev/Dockerfile
    container_name: botfarm-eu-018-solidity-dev
    restart: unless-stopped
    env_file: .env
    ports:
      - "9517:9517"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
