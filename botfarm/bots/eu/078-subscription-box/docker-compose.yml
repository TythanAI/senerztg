# Build from the botfarm root:  docker compose -f bots/eu/078-subscription-box/docker-compose.yml up -d
services:
  botfarm-eu-078-subscription-box:
    build:
      context: ../../..
      dockerfile: bots/eu/078-subscription-box/Dockerfile
    container_name: botfarm-eu-078-subscription-box
    restart: unless-stopped
    env_file: .env
    ports:
      - "9577:9577"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
