# Build from the botfarm root:  docker compose -f bots/eu/054-study-abroad/docker-compose.yml up -d
services:
  botfarm-eu-study-abroad:
    build:
      context: ../../..
      dockerfile: bots/eu/054-study-abroad/Dockerfile
    container_name: botfarm-eu-study-abroad
    restart: unless-stopped
    env_file: .env
    ports:
      - "9253:9253"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
