# Build from the botfarm root:  docker compose -f bots/eu/001-index-investing/docker-compose.yml up -d
services:
  botfarm-eu-001-index-investing:
    build:
      context: ../../..
      dockerfile: bots/eu/001-index-investing/Dockerfile
    container_name: botfarm-eu-001-index-investing
    restart: unless-stopped
    env_file: .env
    ports:
      - "9500:9500"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
