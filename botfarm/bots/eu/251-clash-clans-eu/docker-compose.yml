# Build from the botfarm root:  docker compose -f bots/eu/251-clash-clans-eu/docker-compose.yml up -d
services:
  botfarm-eu-251-clash-clans-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/251-clash-clans-eu/Dockerfile
    container_name: botfarm-eu-251-clash-clans-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9750:9750"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
