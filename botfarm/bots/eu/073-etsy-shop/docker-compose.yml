# Build from the botfarm root:  docker compose -f bots/eu/073-etsy-shop/docker-compose.yml up -d
services:
  botfarm-eu-073-etsy-shop:
    build:
      context: ../../..
      dockerfile: bots/eu/073-etsy-shop/Dockerfile
    container_name: botfarm-eu-073-etsy-shop
    restart: unless-stopped
    env_file: .env
    ports:
      - "9572:9572"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
