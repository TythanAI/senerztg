# Build from the botfarm root:  docker compose -f bots/eu/009-etf-sparplan/docker-compose.yml up -d
services:
  botfarm-eu-009-etf-sparplan:
    build:
      context: ../../..
      dockerfile: bots/eu/009-etf-sparplan/Dockerfile
    container_name: botfarm-eu-009-etf-sparplan
    restart: unless-stopped
    env_file: .env
    ports:
      - "9508:9508"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
