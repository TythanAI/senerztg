# Build from the botfarm root:  docker compose -f bots/eu/086-chess-eu/docker-compose.yml up -d
services:
  botfarm-eu-chess-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/086-chess-eu/Dockerfile
    container_name: botfarm-eu-chess-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9285:9285"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
