# Build from the botfarm root:  docker compose -f bots/eu/097-gdpr-comply/docker-compose.yml up -d
services:
  botfarm-eu-gdpr-comply:
    build:
      context: ../../..
      dockerfile: bots/eu/097-gdpr-comply/Dockerfile
    container_name: botfarm-eu-gdpr-comply
    restart: unless-stopped
    env_file: .env
    ports:
      - "9296:9296"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
