# Build from the botfarm root:  docker compose -f bots/eu/058-notion-systems/docker-compose.yml up -d
services:
  botfarm-eu-notion-systems:
    build:
      context: ../../..
      dockerfile: bots/eu/058-notion-systems/Dockerfile
    container_name: botfarm-eu-notion-systems
    restart: unless-stopped
    env_file: .env
    ports:
      - "9257:9257"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
