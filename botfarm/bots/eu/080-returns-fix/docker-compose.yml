# Build from the botfarm root:  docker compose -f bots/eu/080-returns-fix/docker-compose.yml up -d
services:
  botfarm-eu-returns-fix:
    build:
      context: ../../..
      dockerfile: bots/eu/080-returns-fix/Dockerfile
    container_name: botfarm-eu-returns-fix
    restart: unless-stopped
    env_file: .env
    ports:
      - "9279:9279"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
