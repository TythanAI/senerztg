# Build from the botfarm root:  docker compose -f bots/eu/206-humble-bundle-eu/docker-compose.yml up -d
services:
  botfarm-eu-206-humble-bundle-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/206-humble-bundle-eu/Dockerfile
    container_name: botfarm-eu-206-humble-bundle-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9705:9705"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
