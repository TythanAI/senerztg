# Build from the botfarm root:  docker compose -f bots/eu/031-ai-prompts/docker-compose.yml up -d
services:
  botfarm-eu-ai-prompts:
    build:
      context: ../../..
      dockerfile: bots/eu/031-ai-prompts/Dockerfile
    container_name: botfarm-eu-ai-prompts
    restart: unless-stopped
    env_file: .env
    ports:
      - "9230:9230"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
