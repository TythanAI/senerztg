# Build from the botfarm root:  docker compose -f bots/eu/055-freelance-start/docker-compose.yml up -d
services:
  botfarm-eu-freelance-start:
    build:
      context: ../../..
      dockerfile: bots/eu/055-freelance-start/Dockerfile
    container_name: botfarm-eu-freelance-start
    restart: unless-stopped
    env_file: .env
    ports:
      - "9254:9254"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
