# Build from the botfarm root:  docker compose -f bots/eu/005-debt-payoff/docker-compose.yml up -d
services:
  botfarm-eu-005-debt-payoff:
    build:
      context: ../../..
      dockerfile: bots/eu/005-debt-payoff/Dockerfile
    container_name: botfarm-eu-005-debt-payoff
    restart: unless-stopped
    env_file: .env
    ports:
      - "9504:9504"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
