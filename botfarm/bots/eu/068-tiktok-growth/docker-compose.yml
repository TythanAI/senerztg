# Build from the botfarm root:  docker compose -f bots/eu/068-tiktok-growth/docker-compose.yml up -d
services:
  botfarm-eu-tiktok-growth:
    build:
      context: ../../..
      dockerfile: bots/eu/068-tiktok-growth/Dockerfile
    container_name: botfarm-eu-tiktok-growth
    restart: unless-stopped
    env_file: .env
    ports:
      - "9267:9267"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
