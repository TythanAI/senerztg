# Build from the botfarm root:  docker compose -f bots/eu/052-spanish-es/docker-compose.yml up -d
services:
  botfarm-eu-052-spanish-es:
    build:
      context: ../../..
      dockerfile: bots/eu/052-spanish-es/Dockerfile
    container_name: botfarm-eu-052-spanish-es
    restart: unless-stopped
    env_file: .env
    ports:
      - "9551:9551"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
