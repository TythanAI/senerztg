# Build from the botfarm root:  docker compose -f bots/eu/328-threads-eu/docker-compose.yml up -d
services:
  botfarm-eu-328-threads-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/328-threads-eu/Dockerfile
    container_name: botfarm-eu-328-threads-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9827:9827"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
