# Build from the botfarm root:  docker compose -f bots/eu/037-macro-coach/docker-compose.yml up -d
services:
  botfarm-eu-037-macro-coach:
    build:
      context: ../../..
      dockerfile: bots/eu/037-macro-coach/Dockerfile
    container_name: botfarm-eu-037-macro-coach
    restart: unless-stopped
    env_file: .env
    ports:
      - "9536:9536"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
