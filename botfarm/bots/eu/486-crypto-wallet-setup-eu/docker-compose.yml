# Build from the botfarm root:  docker compose -f bots/eu/486-crypto-wallet-setup-eu/docker-compose.yml up -d
services:
  botfarm-eu-486-crypto-wallet-setup-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/486-crypto-wallet-setup-eu/Dockerfile
    container_name: botfarm-eu-486-crypto-wallet-setup-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9985:9985"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
