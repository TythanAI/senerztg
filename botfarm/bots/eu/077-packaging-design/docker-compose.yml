# Build from the botfarm root:  docker compose -f bots/eu/077-packaging-design/docker-compose.yml up -d
services:
  botfarm-eu-077-packaging-design:
    build:
      context: ../../..
      dockerfile: bots/eu/077-packaging-design/Dockerfile
    container_name: botfarm-eu-077-packaging-design
    restart: unless-stopped
    env_file: .env
    ports:
      - "9576:9576"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
