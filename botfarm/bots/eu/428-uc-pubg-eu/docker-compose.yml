# Build from the botfarm root:  docker compose -f bots/eu/428-uc-pubg-eu/docker-compose.yml up -d
services:
  botfarm-eu-428-uc-pubg-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/428-uc-pubg-eu/Dockerfile
    container_name: botfarm-eu-428-uc-pubg-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9927:9927"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
