# Build from the botfarm root:  docker compose -f bots/eu/333-signal-eu/docker-compose.yml up -d
services:
  botfarm-eu-333-signal-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/333-signal-eu/Dockerfile
    container_name: botfarm-eu-333-signal-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9832:9832"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
