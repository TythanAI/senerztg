# Build from the botfarm root:  docker compose -f bots/eu/006-budget-app/docker-compose.yml up -d
services:
  botfarm-eu-006-budget-app:
    build:
      context: ../../..
      dockerfile: bots/eu/006-budget-app/Dockerfile
    container_name: botfarm-eu-006-budget-app
    restart: unless-stopped
    env_file: .env
    ports:
      - "9505:9505"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
