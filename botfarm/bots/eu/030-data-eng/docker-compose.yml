# Build from the botfarm root:  docker compose -f bots/eu/030-data-eng/docker-compose.yml up -d
services:
  botfarm-eu-030-data-eng:
    build:
      context: ../../..
      dockerfile: bots/eu/030-data-eng/Dockerfile
    container_name: botfarm-eu-030-data-eng
    restart: unless-stopped
    env_file: .env
    ports:
      - "9529:9529"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
