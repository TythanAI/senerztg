# Build from the botfarm root:  docker compose -f bots/eu/064-shopify-store/docker-compose.yml up -d
services:
  botfarm-eu-064-shopify-store:
    build:
      context: ../../..
      dockerfile: bots/eu/064-shopify-store/Dockerfile
    container_name: botfarm-eu-064-shopify-store
    restart: unless-stopped
    env_file: .env
    ports:
      - "9563:9563"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
