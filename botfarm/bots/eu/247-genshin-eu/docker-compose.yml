# Build from the botfarm root:  docker compose -f bots/eu/247-genshin-eu/docker-compose.yml up -d
services:
  botfarm-eu-247-genshin-eu:
    build:
      context: ../../..
      dockerfile: bots/eu/247-genshin-eu/Dockerfile
    container_name: botfarm-eu-247-genshin-eu
    restart: unless-stopped
    env_file: .env
    ports:
      - "9746:9746"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
