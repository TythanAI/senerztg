# Build from the botfarm root:  docker compose -f bots/eu/025-saas-launch/docker-compose.yml up -d
services:
  botfarm-eu-saas-launch:
    build:
      context: ../../..
      dockerfile: bots/eu/025-saas-launch/Dockerfile
    container_name: botfarm-eu-saas-launch
    restart: unless-stopped
    env_file: .env
    ports:
      - "9224:9224"
    volumes:
      - ./data:/app/bot/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
